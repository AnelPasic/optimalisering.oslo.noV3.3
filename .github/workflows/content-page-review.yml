name: Content page review

on:
  push:
    branches:
      - feat/content-lokal-seo-page
  pull_request:
    paths:
      - "app/src/content/pages/**"
      - "app/tests/*seo*"
      - "app/tests/google-bedriftsprofil-page.test.ts"
      - "app/tests/universal-global-content.test.ts"
      - "app/tests/hero-optional-image-cms.test.ts"
      - "app/tests/faq-global-local-polish.test.ts"
      - "app/tests/page-list-v2.test.ts"
      - "app/src/lib/page-list.ts"
      - "app/src/lib/home-builder.ts"
      - "app/src/lib/cms-link-choice.ts"
      - "app/src/lib/rich-markdown.ts"
      - "app/tests/global-rich-markdown.test.ts"
      - "app/scripts/sync-cms-url-options.mjs"
      - "app/tests/cms-url-picker.test.ts"
      - "app/src/lib/content-schema.ts"
      - "app/src/lib/service-sections.ts"
      - "app/src/components/**"
      - ".pages.yml"
      - "app/src/content/site-chrome/appearance.json"
      - "app/src/styles/app.css"
      - "app/src/styles/typography.css"
      - "app/src/styles/shared.css"
      - "app/src/styles/compositions/home.css"
      - "app/src/styles/compositions/package.css"
      - "app/src/styles/compositions/assessment.css"
      - "app/src/styles/compositions/sections.css"
      - "app/src/styles/compositions/service.css"
      - "app/src/styles/compositions/pricing.css"
      - "app/src/styles/terminology.css"
      - "app/tests/typography-heading-dedup.test.ts"
      - "app/src/lib/site-chrome-typography.ts"
      - "app/src/lib/site-chrome-theme.ts"
      - "app/tests/theme-semicolon-parity.test.ts"
      - "app/tests/typography-cms-pilot.test.ts"
      - "app/scripts/qa-cms-typography-pilot.mjs"
      - "app/scripts/qa-component-first-cards.mjs"
      - ".github/workflows/content-page-review.yml"

permissions:
  contents: read

jobs:
  check-content:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify generated PageList page dropdown
        run: node scripts/sync-page-list-select.mjs --check
      - name: Check generated CMS URL suggestions
        run: node scripts/sync-cms-url-options.mjs --check
      - name: Focused content tests
        run: node --test tests/lokal-seo-page.test.ts tests/google-bedriftsprofil-page.test.ts tests/header-navigation.test.ts tests/seo-commercial-content.test.ts tests/seo-mixed-composition.test.ts tests/service-global-placements.test.ts tests/page-hero.test.ts tests/hero-presets.test.ts tests/synlighet-hero.test.ts tests/seo-editor-order.test.ts tests/universal-global-content.test.ts tests/hero-optional-image-cms.test.ts tests/faq-global-local-polish.test.ts tests/page-list.test.ts tests/h021b-visuals.test.ts tests/page-list-v2.test.ts tests/cms-url-picker.test.ts tests/global-rich-markdown.test.ts
      - name: Validate CMS typography schema, saved values and 6xl mapping
        run: node --test tests/typography-cms-pilot.test.ts
      - name: Verify global heading ownership and intentional exceptions
        run: node --test tests/typography-heading-dedup.test.ts
      - name: Verify CMS theme semicolon tolerance and security (Light/sunset Dark)
        run: node --test tests/theme-semicolon-parity.test.ts
      - name: Astro check
        run: npm run check
      - name: Build static pages
        run: npm run build
      - name: Install Chromium for native typography parity
        run: npx playwright install --with-deps chromium
      - name: Verify Oslo computed typography unchanged and native CMS overrides functional
        run: node scripts/qa-cms-typography-pilot.mjs
      - name: Verify native media cards across mobile/tablet/desktop and both themes
        run: node scripts/qa-component-first-cards.mjs
      - name: Validate generated links and page metadata
        run: node scripts/audit-build.mjs
