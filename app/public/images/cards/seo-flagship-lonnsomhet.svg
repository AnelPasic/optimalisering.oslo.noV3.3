<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 600 400" role="img"><title>Regneeksempel: 4 500 kroner investering, 3 000 kroner per kunde, 1,5 kunder, 5 kvalifiserte henvendelser</title><rect x="0" y="0" width="600" height="400" rx="0" fill="#f7f6f4" stroke="none"/><rect x="32" y="25" width="536" height="92" rx="15" fill="#fff" stroke="none"/><text x="52" y="61" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#392940" text-anchor="start">SEO per måned</text><text x="548" y="93" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#392940" text-anchor="end">4 500 kr</text><rect x="32" y="131" width="536" height="92" rx="15" fill="#fff" stroke="none"/><text x="52" y="167" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#392940" text-anchor="start">Dekningsbidrag per kunde</text><text x="548" y="199" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#392940" text-anchor="end">3 000 kr</text><rect x="32" y="238" width="254" height="126" rx="15" fill="#22776f" stroke="none"/><text x="159" y="294" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#fff" text-anchor="middle">1,5</text><text x="159" y="334" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#fff" text-anchor="middle">kunder i snitt</text><rect x="300" y="238" width="268" height="126" rx="15" fill="#d4e9e0" stroke="none"/><text x="434" y="294" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#22776f" text-anchor="middle">5</text><text x="434" y="334" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#392940" text-anchor="middle">henvendelser</text></svg>
