            label: Felles pakker for forsiden, /priser/, /synlighet/ og /konvertering/
            description: Rediger pakketekst, etiketter, ikoner og illustrasjoner her. Forsiden har sammenfoldede detaljer; prissiden har åpne detaljer. Begge og serviceprisene arver denne kilden. Pakkenøkler og lenkemål er beskyttet.
