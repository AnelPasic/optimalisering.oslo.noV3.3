            fields:
              - name: eyebrow
                label: Overtekst
                type: string
                required: true
              - name: heading
                label: Overskrift
                type: string
                required: true
              - name: intro
                label: Ingress
                type: text
                required: true
              - name: formula
                label: Enkel formel
                type: string
                required: true
