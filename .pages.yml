# Pages CMS: separate homepage review editor; all other content remains frozen.
media:
  input: app/src/assets
  output: /assets
components:
  link:
    type: object
    fields:
      - name: label
        label: Lenketekst
        type: string
        required: true
      - name: href
        label: Intern lenke
        type: string
        pattern: ^/
        required: true
content:
  - name: pages
    label: Nettsider
    type: collection
    path: app/src/content/pages
    exclude:
      - home.json
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields:
        - title
        - authority
        - status
        - kind
    fields:
      - name: slug
        label: Nettadresse
        type: string
        readonly: true
      - name: kind
        label: Sidetype
        type: string
        readonly: true
      - name: status
        label: Godkjenningsstatus
        description: Endres i Git etter innholds- og eiergjennomgang. Kladd er ikke
          publiseringstillatelse.
        type: string
        readonly: true
      - name: authority
        label: Innholdsautoritet
        description: DRAFT / NON-AUTHORITATIVE gjelder til en uttrykkelig innholdslås er
          dokumentert i coordination/DECISIONS.md.
        type: string
        readonly: true
      - name: seo
        label: Søkeresultat
        type: object
        fields:
          - name: title
            label: Sidetittel
            type: string
            required: true
          - name: description
            label: Beskrivelse
            type: text
            required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: title
        label: Hovedoverskrift
        type: string
        required: true
      - name: intro
        label: Innledning
        type: text
        required: true
      - name: sections
        label: Innhold
        type: object
        list: true
        fields:
          - name: id
            label: Seksjonens lenkeanker
            type: string
            readonly: true
          - name: eyebrow
            label: Overtekst
            type: string
          - name: heading
            label: Overskrift
            type: string
          - name: body
            label: Avsnitt
            type: text
            list: true
          - name: items
            label: Alternativer eller steg
            type: object
            list: true
            fields:
              - name: title
                label: Tittel
                type: string
              - name: text
                label: Beskrivelse
                type: text
              - name: href
                label: Intern lenke
                type: string
                pattern: ^/
              - name: label
                label: Lenketekst
                type: string
          - name: links
            label: Relaterte lenker
            component: link
            list: true
      - name: faq
        label: Spørsmål og svar
        type: object
        list: true
        fields:
          - name: question
            label: Spørsmål
            type: string
          - name: answer
            label: Svar
            type: text
      - name: cta
        label: Neste steg
        component: link
  - name: homepage
    label: Forside – H-005B til vurdering
    type: file
    path: app/src/content/pages/home.json
    format: json
    fields:
      - name: slug
        label: Nettadresse
        type: string
        readonly: true
      - name: kind
        label: Sidetype
        type: string
        readonly: true
      - name: status
        label: Godkjenningsstatus
        type: string
        readonly: true
      - name: authority
        label: Innholdsautoritet
        type: string
        readonly: true
        description: H-005B er en representativ revisjon til vurdering. Faktisk
          innholdslås må registreres i coordination/DECISIONS.md.
      - name: seo
        label: Søkeresultat
        type: object
        fields:
          - name: title
            label: Tittel
            type: string
          - name: description
            label: Beskrivelse
            type: text
      - name: eyebrow
        label: Overtekst
        type: string
      - name: title
        label: Tittel
        type: string
      - name: intro
        label: Innledning
        type: text
      - name: cta
        label: Primær handling
        type: object
        fields:
          - name: label
            label: Tekst
            type: string
          - name: href
            label: Intern lenke
            type: string
            pattern: ^/
      - name: homepage
        label: Forsidens innhold
        type: object
        fields:
          - name: secondaryCta
            label: Sekundær handling
            type: object
            fields:
              - name: label
                label: Tekst
                type: string
              - name: href
                label: Intern lenke
                type: string
                pattern: ^/
          - name: illustration
            label: Illustrasjon
            type: object
            fields:
              - name: label
                label: Tekst
                type: string
              - name: ariaLabel
                label: Tilgjengelig beskrivelse
                type: string
              - name: search
                label: Søketekst
                type: string
              - name: business
                label: Illustrert bedrift
                type: string
              - name: heading
                label: Nettsidens budskap
                type: string
              - name: description
                label: Nettsidens beskrivelse
                type: string
              - name: action
                label: Illustrert handling
                type: string
              - name: outcome
                label: Illustrert utfall
                type: string
          - name: selector
            label: Behovsvelger
            type: object
            fields:
              - name: heading
                label: Overskrift
                type: string
              - name: items
                label: Alternativer
                type: object
                list: true
                fields:
                  - name: title
                    label: Tittel
                    type: string
                  - name: discipline
                    label: Fagområde
                    type: string
                  - name: description
                    label: Beskrivelse
                    type: text
                  - name: link
                    label: link
                    type: object
                    fields:
                      - name: label
                        label: Tekst
                        type: string
                      - name: href
                        label: Intern lenke
                        type: string
                        pattern: ^/
          - name: calculator
            label: Regneeksempel
            type: object
            fields:
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: intro
                label: Innledning
                type: text
              - name: formula
                label: Enkel formel
                type: string
              - name: labels
                label: Etiketter
                type: object
                fields:
                  - name: visits
                    label: Relevante besøk per måned
                    type: string
                  - name: conversion
                    label: Konverteringsrate i dag
                    type: string
                  - name: trafficIncrease
                    label: Mer relevant trafikk
                    type: string
                  - name: newConversion
                    label: Ny konverteringsrate
                    type: string
                  - name: current
                    label: I dag
                    type: string
                  - name: scenario
                    label: Scenario
                    type: string
                  - name: difference
                    label: Forskjell
                    type: string
                  - name: outcome
                    label: Resultatenhet
                    type: string
                  - name: increase
                    label: Prosentvis endring
                    type: string
                  - name: undefinedIncrease
                    label: Merknad ved null utgangspunkt
                    type: string
                  - name: invalid
                    label: Veiledning ved ugyldige verdier
                    type: string
              - name: defaults
                label: Startverdier
                type: object
                fields:
