        label: Før-verdi
        type: string
        readonly: true
      - name: after
        label: Etter-verdi
        type: string
        readonly: true
      - name: delta
        label: Dokumentert endring
        type: string
        readonly: true
      - name: period
        label: Sammenligningsperioder
        type: object
        fields:
