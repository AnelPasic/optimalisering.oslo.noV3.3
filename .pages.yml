            required: true
          - name: description
            label: Metabeskrivelse
            type: text
            required: true
        required: true
      - name: eyebrow
        label: Toppseksjon (Hero) – Overtekst
        type: string
        required: true
      - name: title
        label: Hovedoverskrift
        type: string
        required: true
      - name: intro
        label: Ingress
        type: text
        required: true
      - name: cta
        label: Primær handling
        type: object
        fields:
          - name: label
            label: Tekst
            type: string
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^/
            required: true
        required: true
      - name: homepage
        label: Forsidens innhold
        type: object
        fields:
          - name: secondaryCta
            label: Sekundær handling
            type: object
            fields:
              - name: label
                label: Tekst
                type: string
                required: true
              - name: href
                label: Intern lenke
                type: string
                pattern: ^/
                required: true
            required: true
          - name: heroPhoto
            label: Forsidefoto
            type: object
            fields:
              - name: src
                label: Valgt bilde
                type: image
                options:
                  media: heroImages
                  extensions:
                    - webp
                required: true
              - name: positionX
                label: Horisontalt utsnitt (%)
                type: number
                options:
                  min: 0
                  max: 100
                required: true
              - name: positionY
                label: Vertikalt utsnitt (%)
                type: number
                options:
                  min: 0
                  max: 100
                required: true
            required: true
          - name: selector
            label: Behovsvelger
            type: object
            fields:
              - name: heading
                label: Overskrift
                type: string
                required: true
              - name: items
                label: Alternativer
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                  min: 3
                  max: 3
                fields:
                  - name: title
                    label: Tittel
                    type: string
                    required: true
                  - name: discipline
                    label: Fagområde
                    type: string
                    required: true
                  - name: description
                    label: Beskrivelse
                    type: text
                    required: true
                  - name: link
                    label: Lenke
                    type: object
