        description: Velg Følg normal tone med mindre du vil styre denne teksttypen særskilt.
        options: &voicePresetOverrides
          values:
            - name: inherit
              label: Følg normal tone
            - name: noktern
              label: Nøktern
            - name: medon
              label: Medon
            - name: spiss
              label: Spiss
            - name: spissplus
