                        required: true
                      - &hubHeropositionY
                        name: positionY
                        label: Vertikalt utsnitt (%)
                        type: number
                        default: 50
                        options:
                          min: 0
                          max: 100
                        required: true
      - name: sections
        label: Innholdsseksjoner
