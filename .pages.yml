# Pages CMS: one shared package source in home.json; review/launch gates remain in coordination.
media:
  - name: assets
    label: Eksisterende media
    input: app/src/assets
    output: /assets
  - name: heroImages
    label: Forsidefoto – valgte bilde og alternativer
    input: app/public/images/home
    output: /images/home
    extensions:
      - webp
    rename: safe
  - name: serviceHeroImages
    label: Tjenestenes drømmeutfall – leverte bilder og illustrasjoner
    input: app/public/images/services
    output: /images/services
    extensions:
      - webp
      - png
      - jpg
      - jpeg
      - avif
      - svg
    rename: safe
  - name: packageVisuals
    label: Pakkeillustrasjoner – SVG, WebP og PNG
    input: app/public/images/pricing
    output: /images/pricing
    extensions:
      - svg
      - webp
      - png
    rename: safe
settings:
  content:
    merge: true
  commit:
    templates:
      update: "Innholdsoppdatering: {path} (via Pages CMS)"
      create: "Nytt innhold: {path} (via Pages CMS)"
      delete: "Slettet innhold: {path} (via Pages CMS)"
components:
  link:
    type: object
    fields:
      - name: label
        label: Lenketekst
        type: string
        required: true
      - name: href
        label: Intern lenke
        type: string
        pattern: ^/
        required: true
content:
  - name: homepage
    label: Forside
    type: file
    path: app/src/content/pages/home.json
    format: json
    fields:
      - name: seo
        label: SEO
        type: object
        fields:
          - name: title
            label: Sidetittel
            type: string
          - name: description
            label: Metabeskrivelse
            type: text
      - name: eyebrow
        label: Toppseksjon (Hero) – Overtekst
        type: string
      - name: title
        label: Hovedoverskrift
        type: string
      - name: intro
        label: Ingress
        type: text
      - name: cta
        label: Primær handling
        type: object
        fields:
          - name: label
            label: Tekst
            type: string
          - name: href
            label: Intern lenke
            type: string
            pattern: ^/
      - name: homepage
        label: Forsidens innhold
        type: object
        fields:
          - name: secondaryCta
            label: Sekundær handling
            type: object
            fields:
              - name: label
                label: Tekst
                type: string
              - name: href
                label: Intern lenke
                type: string
                pattern: ^/
          - name: heroPhoto
            label: Forsidefoto
            type: object
            fields:
              - name: src
                label: Valgt bilde
                type: image
                options:
                  media: heroImages
                  extensions:
                    - webp
              - name: positionX
                label: Horisontalt utsnitt (%)
                type: number
                options:
                  min: 0
                  max: 100
              - name: positionY
                label: Vertikalt utsnitt (%)
                type: number
                options:
                  min: 0
                  max: 100
          - name: selector
            label: Behovsvelger
            type: object
            fields:
              - name: heading
                label: Overskrift
                type: string
              - name: items
                label: Alternativer
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: Tittel
                    type: string
                  - name: discipline
                    label: Fagområde
                    type: string
                  - name: description
                    label: Beskrivelse
                    type: text
                  - name: link
                    label: Lenke
                    type: object
                    fields:
                      - name: label
                        label: Tekst
                        type: string
                      - name: href
                        label: Intern lenke
                        type: string
                        pattern: ^/
          - name: calculator
            label: Regneeksempel
            type: object
            fields:
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: intro
                label: Ingress
                type: text
              - name: formula
                label: Enkel formel
                type: string
              - name: labels
                label: Etiketter
                type: object
                fields:
                  - name: visits
                    label: Relevante besøk per måned
                    type: string
                  - name: conversion
                    label: Konverteringsrate i dag
                    type: string
                  - name: trafficIncrease
                    label: Mer relevant trafikk
                    type: string
                  - name: newConversion
                    label: Ny konverteringsrate
                    type: string
                  - name: current
                    label: I dag
                    type: string
                  - name: scenario
                    label: Scenario
                    type: string
                  - name: difference
                    label: Forskjell
                    type: string
                  - name: outcome
                    label: Resultatenhet
                    type: string
                  - name: increase
                    label: Prosentvis endring
                    type: string
                  - name: undefinedIncrease
                    label: Merknad ved null utgangspunkt
                    type: string
                  - name: invalid
                    label: Veiledning ved ugyldige verdier
                    type: string
              - name: defaults
                label: Startverdier
                type: object
                fields:
                  - name: visits
                    label: Relevante besøk per måned
                    type: number
                  - name: conversion
                    label: Konverteringsrate i dag
                    type: number
                  - name: trafficIncrease
                    label: Mer relevant trafikk
                    type: number
                  - name: newConversion
                    label: Ny konverteringsrate
                    type: number
              - name: caveat
                label: Forbehold
                type: text
          - name: packages
            label: Felles pakker for forsiden, /priser/, /synlighet/ og /konvertering/
            description: Rediger pakketekst, etiketter, ikoner og illustrasjoner her. Forsiden har sammenfoldede detaljer;
              prissiden har åpne detaljer. Begge og serviceprisene arver denne kilden. Pakkenøkler og lenkemål
              er beskyttet.
            type: object
            fields:
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: intro
                label: Ingress
                type: text
              - name: labels
                label: Etiketter i pakkekortene
                type: object
                fields:
                  - name: situations
                    label: Typiske situasjoner
                    type: string
                  - name: typicalBusiness
                    label: Typisk virksomhet
                    type: string
                  - name: focus
                    label: Fokus
                    type: string
                  - name: combinations
                    label: Populære kombinasjoner
                    type: string
                  - name: workAreas
                    label: Arbeidsområder
                    type: string
                  - name: uncertain
                    label: Usikker? Ta en gratis sjekk
                    type: string
              - name: fitLabel
                label: Etikett for hvem tjenesten passer
                type: string
              - name: scopeLabel
                label: Etikett for arbeidsidé
                type: string
              - name: areasLabel
                label: Etikett for arbeidsområder
                type: string
              - name: areas
                label: Fire arbeidsområder
                type: string
                list: true
              - name: foundationNote
                label: Måling og sporing – felles grunnlag
                type: text
              - name: adBudgetNote
                label: Annonsebudsjett kommer i tillegg
                type: string
              - name: externalCostsNote
                label: Eksterne plattformkostnader
                type: text
              - name: separateWorkNote
                label: Arbeid som prises separat
                type: text
              - name: capacityNote
                label: Ubrukt kapasitet
                type: text
              - name: decisionStrip
                label: Valgstripe på prissiden
                type: object
                fields:
                  - name: heading
                    label: Overskrift
                    type: string
                  - name: items
                    label: Tre valgregler i pakkerekkefølge
                    type: text
                    list: true
              - name: multiplier
                label: Hvorfor Vekst finnes – prissiden
                type: object
                fields:
                  - name: eyebrow
                    label: Overtekst
                    type: string
                  - name: heading
                    label: Overskrift
                    type: string
                  - name: body
                    label: Forklaring
                    type: text
                  - name: conceptualRow
                    label: Bli funnet → bli valgt → gå videre
                    type: string
                  - name: support
                    label: Støttetekst
                    type: text
              - name: items
                label: Alternativer
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: Tittel
                    type: string
                  - name: descriptor
                    label: Pakkeoppsummering
                    type: string
                  - name: fit
                    label: Full tekst – hvem pakken passer for
                    type: text
                  - name: compact
                    label: Kort tekst
                    type: object
                    fields:
                      - name: fit
                        label: Kort Passer for – forsiden og prissiden
                        type: text
                      - name: situations
                        label: Maks tre korte situasjoner
                        type: string
                        list: true
                  - name: scope
                    label: Slik jobber vi – valgfritt
                    type: text
                  - name: typicalBusiness
                    label: Typisk virksomhet
                    type: text
                  - name: situations
                    label: Typiske situasjoner
                    type: text
                    list: true
                  - name: key
                    label: Stabil pakkenøkkel for bestilling
                    type: string
                    readonly: true
                  - name: iconItems
                    label: Fokus og populære kombinasjoner
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{label}"
                    fields:
                      - name: icon
                        label: Generisk ikon
                        type: select
                        options:
                          values:
                            - search
                            - conversion
                            - local
                            - paid-search
                            - social-paid
                            - analytics
                            - page
                            - route
                      - name: label
                        label: Fokus eller kombinasjon
                        type: string
                      - name: compactLabel
                        label: Kort etikett
                        type: string
                      - name: description
                        label: Forklaring – valgfri
                        type: text
                  - name: selectionRule
                    label: Valgregel
                    type: text
                  - name: distinction
                    label: Ekstra forklaring – valgfri
                    type: text
                  - name: priceNote
                    label: Partner – omfang og prisavtale
                    type: text
                  - name: visual
                    label: SVG-motiv – brukes når eget bilde ikke er valgt
                    type: select
                    options:
                      values:
                        - controlled
                        - accelerating
                        - tracks
                  - name: visualAsset
                    label: Eget pakkebilde – velg eller last opp SVG, WebP eller PNG
                    type: object
                    fields:
                      - name: src
                        label: Bilde
                        type: image
                        options:
                          media: packageVisuals
                          extensions:
                            - svg
                            - webp
                            - png
                      - name: alt
                        label: Sannferdig beskrivende alternativ tekst
                        type: string
                      - name: positionX
                        label: Horisontalt utsnitt (%) – raster
                        type: number
                        options:
                          min: 0
                          max: 100
                      - name: positionY
                        label: Vertikalt utsnitt (%) – raster
                        type: number
                        options:
                          min: 0
                          max: 100
                  - name: visualCaption
                    label: Bildetekst ved SVG-motivet
                    description: Vises ved SVG-motivet når eget bilde ikke er valgt. Eget bilde bruker sin alternative tekst og
                      sitt utsnitt.
                    type: object
                    fields:
                      - name: label
                        label: Kort semantisk etikett
                        type: string
                      - name: support
                        label: Kort støtte – valgfri
                        type: string
                  - name: price
                    label: Månedspris i kroner
                    type: number
                  - name: pricePrefix
                    label: Fra-pris – bare Partner
                    description: Valgfritt. Kun tredje pakke kan ha fra; de to andre har fast pris. Fjern feltet for pakker uten
                      prefiks.
                    type: select
                    options:
                      values:
                        - fra
                  - name: detailLink
                    label: Detaljer – rediger teksten, lenkemålet er beskyttet
                    type: object
                    fields:
                      - name: label
                        label: Lenketekst
                        type: string
                      - name: href
                        label: Pakkeanker på /priser/
                        type: string
                        readonly: true
                        pattern: ^/priser/#
                  - name: priceSuffix
                    label: Prisenhet
                    type: string
                  - name: vatSuffix
                    label: MVA-tekst
                    description: Bruk samme MVA-tekst for alle tre pakker; felles prisforklaring og gjentatte prisopplysninger
                      arver den.
                    type: string
                  - name: recommended
                    label: Anbefalt pakke
                    type: boolean
                    default: false
                  - name: badge
                    label: Anbefalt-merke
                    type: string
                  - name: cta
                    label: Primær bestilling – sikker rute og valgt pakke
                    type: object
                    fields:
                      - name: label
                        label: Knappetekst
                        type: string
                      - name: href
                        label: Intern lenke
                        type: string
                        readonly: true
                        pattern: ^/priser/\?pakke=(optimalisering|vekst|partner)#bestill$
          - name: proof
            label: Dokumenterte resultater – separat publiseringsvern
            type: object
            fields:
              - name: publicationApproved
                label: Godkjenn visning av allerede publiserbare case
                description: Slå bare på etter dokumentert godkjenning. Dette overstyrer aldri case-status, tillatelse eller
                  manglende evidens.
                type: boolean
                default: false
              - name: caseIds
                label: Velg case fra evidensregisteret
                type: reference
                options:
                  collection: proofCases
                  multiple: true
                  value: "{fields.id}"
                  label: "{fields.clientName} ({fields.publicationStatus})"
                  search: id,clientName,anonymizedLabel
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: beforeLabel
                label: Før-etikett
                type: string
              - name: afterLabel
                label: Etter-etikett
                type: string
              - name: changeLabel
                label: Endring-etikett
                type: string
          - name: form
            label: Skjema
            type: object
            fields:
              - name: promise
                label: Gratis sjekk – leveranseløfte
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: websiteLabel
                label: Etikett for nettside
                type: string
              - name: websitePlaceholder
                label: Eksempel på nettside
                type: string
              - name: emailLabel
                label: Etikett for e-post
                type: string
              - name: emailPlaceholder
                label: Eksempel på e-post
                type: string
              - name: messageLabel
                label: Etikett for kommentar
                type: string
              - name: optional
                label: Valgfritt-merknad
                type: string
              - name: messagePlaceholder
                label: Eksempel på kommentar
                type: string
              - name: sensitiveNotice
                label: Merknad om sensitive opplysninger
                type: string
              - name: previewNotice
                label: Forhåndsvisningsmerknad
                type: string
              - name: submitLabel
                label: Knappetekst
                type: string
              - name: privacyText
                label: Personvernmerknad
                type: string
              - name: privacyLink
                label: Personvernlenke
                type: object
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: disabledStatus
                label: Status ved stengt innsending
                type: string
          - name: faqHeading
            label: FAQ-overskrift
            type: string
          - name: faqEyebrow
            label: FAQ-overtekst
            type: string
          - name: chrome
            label: Toppmeny og bunntekst
            type: object
            fields:
              - name: brand
                label: Merkenavn
                type: string
              - name: brandLocation
                label: Stedsnavn i ordmerket
                type: string
              - name: homeLabel
                label: Tilgjengelig forsidenavn
                type: string
              - name: skipLabel
                label: Hopp til innhold
                type: string
              - name: navigationLabel
                label: Hovedmenynavn
                type: string
              - name: mobileNavigationLabel
                label: Mobilmenynavn
                type: string
              - name: openMenu
                label: Åpne meny
                type: string
              - name: closeMenu
                label: Lukk meny
                type: string
              - name: assessmentLink
                label: Lenke til gratis sjekk
                type: object
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: navigation
                label: Navigasjon
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: providerText
                label: Påkrevd leverandøropplysning
                type: string
                readonly: true
              - name: previewLabel
                label: Forhåndsvisningsetikett
                type: string
              - name: serviceNavigationLabel
                label: Tjenestemenynavn
                type: string
              - name: informationNavigationLabel
                label: Informasjonsmenynavn
                type: string
              - name: storeLink
                label: Nettbutikklenke
                type: object
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: informationLinks
                label: Informasjonslenker
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: copyrightProvider
                label: Tjenestemerke i opphavsrett
                type: string
              - name: footerNote
                label: Bunntekstmerknad
                type: string
      - name: sections
        label: Innholdsseksjoner
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: id
            label: Seksjonens lenkeanker
            type: string
            readonly: true
          - name: eyebrow
            label: Overtekst
            type: string
          - name: heading
            label: Overskrift
            type: string
          - name: body
            label: Avsnitt
            type: text
            list: true
          - name: items
            label: Alternativer
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Tittel
                type: string
              - name: text
                label: Beskrivelse
                type: string
          - name: links
            label: Relaterte lenker
            component: link
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
      - name: faq
        label: Ofte stilte spørsmål
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Spørsmål
            type: string
          - name: answer
            label: Svar
            type: text
    operations: &a1
      create: false
      rename: false
      delete: false
  - name: services
    label: Tjenester
    type: collection
    path: app/src/content/pages
    exclude:
      - home.json
      - innsikt.json
      - priser.json
      - om.json
      - vurdering.json
      - kontakt.json
      - personvern.json
      - vilkar.json
      - hva-bor-optimaliseres-forst.json
      - male-effekt-av-optimalisering.json
    format: json
    subfolders: false
    operations: *a1
    filename: "{primary}.json"
    view:
      primary: title
      fields:
        - title
      search:
        - title
        - seo.title
      sort:
        - title
    fields:
      - &a2
        name: seo
        label: SEO
        type: object
        fields:
          - name: title
            label: Sidetittel
            type: string
            required: true
          - name: description
            label: Metabeskrivelse
            type: text
            required: true
      - name: heroVisual
        label: Hero-bilde / drømmeutfall
        type: object
        fields:
          - name: kind
            label: Bildetype
            type: select
            options:
              values:
                - photo
                - illustration
            required: true
          - name: src
            label: Levert tjenestebilde
            type: image
            options:
              media: serviceHeroImages
            required: true
          - name: alt
            label: Kort beskrivelse av bildets mening
            type: string
            required: true
          - name: positionX
            label: Fokus vannrett (0–100)
            type: number
            required: true
            options:
              min: 0
              max: 100
          - name: positionY
            label: Fokus loddrett (0–100)
            type: number
            required: true
            options:
              min: 0
              max: 100
        description: Valgfritt bilde for Synlighet og Konvertering. Uten et levert bilde vises toppseksjonen med tekst.
      - &a3
        name: eyebrow
        label: Toppseksjon (Hero) – Overtekst
        type: string
      - &a4
        name: title
        label: Hovedoverskrift
        type: string
        required: true
      - &a5
        name: intro
        label: Ingress
        type: text
        required: true
      - &a6
        name: sections
        label: Innholdsseksjoner
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: id
            label: Seksjonens lenkeanker
            type: string
            readonly: true
          - name: eyebrow
            label: Overtekst
            type: string
          - name: heading
            label: Overskrift
            type: string
          - name: body
            label: Avsnitt
            type: text
            list: true
            description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Forsidens
              innhold → Felles pakker.
          - name: items
            label: Alternativer eller steg
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Tittel
                type: string
              - name: text
                label: Beskrivelse
                type: text
              - name: href
                label: Intern lenke
                type: string
                pattern: ^/
              - name: label
                label: Lenketekst
                type: string
          - name: links
            label: Relaterte lenker
            component: link
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
      - &a7
        name: faq
        label: Ofte stilte spørsmål
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Spørsmål
            type: string
          - name: answer
            label: Svar
            type: text
      - &a8
        name: cta
        label: Neste steg
        component: link
  - name: priser
    label: Priser
    type: file
    path: app/src/content/pages/priser.json
    format: json
    operations: *a1
    fields: &a9
      - *a2
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - *a8
  - name: insight
    label: Innsikt
    type: collection
    path: app/src/content/pages
    exclude:
      - home.json
      - priser.json
      - om.json
      - vurdering.json
      - kontakt.json
      - personvern.json
      - vilkar.json
      - synlighet.json
      - konvertering.json
      - seo.json
      - ai-synlighet.json
      - nettbutikkoptimalisering.json
    format: json
    subfolders: false
    operations: *a1
    filename: "{primary}.json"
    view:
      primary: title
      fields:
        - title
      search:
        - title
        - seo.title
      sort:
        - title
    fields: *a9
  - name: om
    label: Om tjenesten
    type: file
    path: app/src/content/pages/om.json
    format: json
    operations: *a1
    fields: *a9
  - name: vurdering
    label: Optimaliseringssjekk
    type: file
    path: app/src/content/pages/vurdering.json
    format: json
    operations: *a1
    fields: *a9
  - name: kontakt
    label: Kontakt
    type: file
    path: app/src/content/pages/kontakt.json
    format: json
    operations: *a1
    fields: *a9
  - name: personvern
    label: Personvern
    type: file
    path: app/src/content/pages/personvern.json
    format: json
    operations: *a1
    fields: *a9
  - name: vilkar
    label: Vilkår
    type: file
    path: app/src/content/pages/vilkar.json
    format: json
    operations: *a1
    fields: *a9
  - name: proofCases
    label: Case/evidens (intern)
    type: collection
    path: app/src/content/proof
    format: json
    filename: "{fields.id}.json"
    view:
      primary: clientName
      fields:
        - clientName
        - publicationStatus
        - namingPermission
        - artifactStatus
    fields:
      - name: id
        label: Stabil case-ID
        description: Referanser fra forsiden bruker denne ID-en. Endring krever at referansene oppdateres.
        type: string
        pattern: ^[a-z0-9][a-z0-9-]*$
        required: true
      - name: clientName
        label: Kunde- eller visningsnavn
        type: string
      - name: anonymizedLabel
        label: Godkjent anonymisert navn
        type: string
      - name: relationship
        label: Relasjon og bakgrunn – intern evidens
        type: text
      - name: dominantMetric
        label: Hovedresultat og måledefinisjon
        type: text
      - name: before
        label: Før-verdi
        type: string
      - name: after
        label: Etter-verdi
        type: string
      - name: delta
        label: Dokumentert endring
        type: string
      - name: period
        label: Sammenligningsperioder
        type: object
        fields:
          - name: before
            label: Før-periode
            type: string
          - name: after
            label: Etter-periode
            type: string
          - name: comparable
            label: Sammenlignbarhet dokumentert
            type: boolean
            default: false
      - name: intervention
        label: Dokumentert tiltak eller endring
        type: text
      - name: source
        label: Kilde og proveniens – intern evidens
        type: text
      - name: limitations
        label: Begrensninger og attribusjonsforbehold
        type: text
      - name: namingPermission
        label: Navne- eller anonymiseringstillatelse
        type: select
        default: NEEDS_PERMISSION
        options:
          values:
            - NEEDS_PERMISSION
            - GRANTED
            - NAME_APPROVED
            - ANONYMIZED_APPROVED
      - name: permissionEvidence
        label: Dokumentasjon på faktisk publiseringstillatelse
        type: text
      - name: strategyReviewStatus
        label: STRATEGY_CONTENT-review
        description: GRANTED tillatelse erstatter ikke review av den konkrete offentlige presentasjonen.
        type: select
        default: READY_FOR_STRATEGY_REVIEW
        options:
          values:
            - READY_FOR_STRATEGY_REVIEW
            - CONTENT_LOCKED
      - name: strategyReviewEvidence
        label: Kilde/revisjon for konkret STRATEGY_CONTENT-lock
        type: text
      - name: artifactStatus
        label: Skjermbilde- og kildeartefaktstatus
        type: select
        default: NOT_IMPORTED
        options:
          values:
            - NOT_IMPORTED
            - IMPORTED
            - VERIFIED
      - name: artifactReferences
        label: Kildeartefaktreferanser – ikke legg persondata i Git
        type: string
        list: true
      - name: evidenceMetrics
        label: Supplerte målinger – intern evidens, ikke offentlig renderer
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{metric}"
        fields:
          - name: metric
            label: Måling og definisjon
            type: text
          - name: before
            label: Før-verdi
            type: string
          - name: after
            label: Etter-verdi
            type: string
          - name: delta
            label: Dokumentert endring
            type: string
          - name: nextPeriod
            label: Neste periodes verdi
            type: string
          - name: timeframe
            label: Periode
            type: string
      - name: publicationStatus
        label: Publiseringsstatus
        description: EVIDENCE_ONLY er intern forberedelse. PUBLISHABLE krever dokumenterte målinger, sammenlignbare
          perioder, tiltak, kilde, forbehold og tillatelse.
        type: select
        default: EVIDENCE_ONLY
        options:
          values:
            - EVIDENCE_ONLY
            - REVIEW_REQUIRED
            - PUBLISHABLE
            - WITHDRAWN
      - name: publicationApproved
        label: Publisering uttrykkelig godkjent
        type: boolean
        default: false
