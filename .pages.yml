# Pages CMS: shared home/pricing/service commercial source; other 11 pages remain frozen.
media:
  - name: assets
    label: Eksisterende media
    input: app/src/assets
    output: /assets
  - name: heroImages
    label: Forsidefoto – valgte bilde og alternativer
    input: app/public/images/home
    output: /images/home
    extensions: [webp]
    rename: safe
components:
  link:
    type: object
    fields:
      - name: label
        label: Lenketekst
        type: string
        required: true
      - name: href
        label: Intern lenke
        type: string
        pattern: ^/
        required: true
content:
  - name: pages
    label: Nettsider
    type: collection
    path: app/src/content/pages
    exclude:
      - home.json
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields:
        - title
        - authority
        - status
        - kind
    fields:
      - name: slug
        label: Nettadresse
        type: string
        readonly: true
      - name: kind
        label: Sidetype
        type: string
        readonly: true
      - name: status
        label: Godkjenningsstatus
        description: Endres i Git etter innholds- og eiergjennomgang. Kladd er ikke
          publiseringstillatelse.
        type: string
        readonly: true
      - name: authority
        label: Innholdsautoritet
        description: DRAFT / NON-AUTHORITATIVE gjelder til en uttrykkelig innholdslås er
          dokumentert i coordination/DECISIONS.md.
        type: string
        readonly: true
      - name: seo
        label: Søkeresultat
        type: object
        fields:
          - name: title
            label: Sidetittel
            type: string
            required: true
          - name: description
            label: Beskrivelse
            type: text
            required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: title
        label: Hovedoverskrift
        type: string
        required: true
      - name: intro
        label: Innledning
        type: text
        required: true
      - name: sections
        label: Innhold
        type: object
        list: true
        fields:
          - name: id
            label: Seksjonens lenkeanker
            type: string
            readonly: true
          - name: eyebrow
            label: Overtekst
            type: string
          - name: heading
            label: Overskrift
            type: string
          - name: body
            label: Avsnitt
            description: På /priser/ er kostnader.body en godkjent referanse. Synlige kostnadsregler, prisbroene på /synlighet/ og /konvertering/ og gjentatte prisfakta styres av Forside > Forsidens innhold > Felles pakker for forsiden, /priser/, /synlighet/ og /konvertering/. Låst tekst etter D-027/D-028/D-031 endres bare etter et nytt scoped handoff.
            type: text
            list: true
          - name: items
            label: Alternativer eller steg
            type: object
            list: true
            fields:
              - name: title
                label: Tittel
                type: string
              - name: text
                label: Beskrivelse
                type: text
              - name: href
                label: Intern lenke
                type: string
                pattern: ^/
              - name: label
                label: Lenketekst
                type: string
          - name: links
            label: Relaterte lenker
            component: link
            list: true
      - name: faq
        label: Spørsmål og svar
        type: object
        list: true
        fields:
          - name: question
            label: Spørsmål
            type: string
          - name: answer
            label: Svar
            type: text
      - name: cta
        label: Neste steg
        component: link
  - name: proofCases
    label: Case- og evidensregister – ingen automatisk publisering
    type: collection
    path: app/src/content/proof
    format: json
    filename: "{fields.id}.json"
    view:
      primary: clientName
      fields: [clientName, publicationStatus, namingPermission, artifactStatus]
    fields:
      - name: id
        label: Stabil case-ID
        description: Referanser fra forsiden bruker denne ID-en. Endring krever at referansene oppdateres.
        type: string
        pattern: ^[a-z0-9][a-z0-9-]*$
        required: true
      - name: clientName
        label: Kunde- eller visningsnavn
        type: string
      - name: anonymizedLabel
        label: Godkjent anonymisert navn
        type: string
      - name: relationship
        label: Relasjon og bakgrunn – intern evidens
        type: text
      - name: dominantMetric
        label: Hovedresultat og måledefinisjon
        type: text
      - name: before
        label: Før-verdi
        type: string
      - name: after
        label: Etter-verdi
        type: string
      - name: delta
        label: Dokumentert endring
        type: string
      - name: period
        label: Sammenligningsperioder
        type: object
        fields:
          - name: before
            label: Før-periode
            type: string
          - name: after
            label: Etter-periode
            type: string
          - name: comparable
            label: Sammenlignbarhet dokumentert
            type: boolean
            default: false
      - name: intervention
        label: Dokumentert tiltak eller endring
        type: text
      - name: source
        label: Kilde og proveniens – intern evidens
        type: text
      - name: limitations
        label: Begrensninger og attribusjonsforbehold
        type: text
      - name: namingPermission
        label: Navne- eller anonymiseringstillatelse
        type: select
        default: NEEDS_PERMISSION
        options:
          values: [NEEDS_PERMISSION, GRANTED, NAME_APPROVED, ANONYMIZED_APPROVED]
      - name: permissionEvidence
        label: Dokumentasjon på faktisk publiseringstillatelse
        type: text
      - name: strategyReviewStatus
        label: STRATEGY_CONTENT-review
        description: GRANTED tillatelse erstatter ikke review av den konkrete offentlige presentasjonen.
        type: select
        default: READY_FOR_STRATEGY_REVIEW
        options:
          values: [READY_FOR_STRATEGY_REVIEW, CONTENT_LOCKED]
      - name: strategyReviewEvidence
        label: Kilde/revisjon for konkret STRATEGY_CONTENT-lock
        type: text
      - name: artifactStatus
        label: Skjermbilde- og kildeartefaktstatus
        type: select
        default: NOT_IMPORTED
        options:
          values: [NOT_IMPORTED, IMPORTED, VERIFIED]
      - name: artifactReferences
        label: Kildeartefaktreferanser – ikke legg persondata i Git
        type: string
        list: true
      - name: evidenceMetrics
        label: Supplerte målinger – intern evidens, ikke offentlig renderer
        type: object
        list: true
        fields:
          - name: metric
            label: Måling og definisjon
            type: text
          - name: before
            label: Før-verdi
            type: string
          - name: after
            label: Etter-verdi
            type: string
          - name: delta
            label: Dokumentert endring
            type: string
          - name: nextPeriod
            label: Neste periodes verdi
            type: string
          - name: timeframe
            label: Periode
            type: string
      - name: publicationStatus
        label: Publiseringsstatus
        description: EVIDENCE_ONLY er intern forberedelse. PUBLISHABLE krever dokumenterte målinger, sammenlignbare perioder, tiltak, kilde, forbehold og tillatelse.
        type: select
        default: EVIDENCE_ONLY
        options:
          values: [EVIDENCE_ONLY, REVIEW_REQUIRED, PUBLISHABLE, WITHDRAWN]
      - name: publicationApproved
        label: Publisering uttrykkelig godkjent
        description: Må være aktivert sammen med PUBLISHABLE og alle nødvendige evidens- og tillatelsesfelt. Godkjenning dokumenteres i coordination/DECISIONS.md.
        type: boolean
        default: false
  - name: homepage
    label: Forside og felles pakker – D-024 kommersiell del-lås
    type: file
    path: app/src/content/pages/home.json
    format: json
    fields:
      - name: slug
        label: Nettadresse
        type: string
        readonly: true
      - name: kind
        label: Sidetype
        type: string
        readonly: true
      - name: status
        label: Godkjenningsstatus
        type: string
        readonly: true
      - name: authority
        label: Innholdsautoritet
        type: string
        readonly: true
        description: H-006 er en representativ revisjon til vurdering. Faktisk
          innholdslås må registreres i coordination/DECISIONS.md.
      - name: seo
        label: Søkeresultat
        type: object
        fields:
          - name: title
            label: Tittel
            type: string
          - name: description
            label: Beskrivelse
            type: text
      - name: eyebrow
        label: Overtekst
        type: string
      - name: title
        label: Tittel
        type: string
      - name: intro
        label: Innledning
        type: text
      - name: cta
        label: Primær handling
        type: object
        fields:
          - name: label
            label: Tekst
            type: string
          - name: href
            label: Intern lenke
            type: string
            pattern: ^/
      - name: homepage
        label: Forsidens innhold
        type: object
        fields:
          - name: secondaryCta
            label: Sekundær handling
            type: object
            fields:
              - name: label
                label: Tekst
                type: string
              - name: href
                label: Intern lenke
                type: string
                pattern: ^/
          - name: heroPhoto
            label: Forsidefoto
            type: object
            fields:
              - name: src
                label: Valgt bilde
                type: image
                options:
                  media: heroImages
                  extensions: [webp]
              - name: positionX
                label: Horisontalt utsnitt (%)
                type: number
                options:
                  min: 0
                  max: 100
              - name: positionY
                label: Vertikalt utsnitt (%)
                type: number
                options:
                  min: 0
                  max: 100
          - name: selector
            label: Behovsvelger
            type: object
            fields:
              - name: heading
                label: Overskrift
                type: string
              - name: items
                label: Alternativer
                type: object
                list: true
                fields:
                  - name: title
                    label: Tittel
                    type: string
                  - name: discipline
                    label: Fagområde
                    type: string
                  - name: description
                    label: Beskrivelse
                    type: text
                  - name: link
                    label: link
                    type: object
                    fields:
                      - name: label
                        label: Tekst
                        type: string
                      - name: href
                        label: Intern lenke
                        type: string
                        pattern: ^/
          - name: calculator
            label: Regneeksempel
            type: object
            fields:
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: intro
                label: Innledning
                type: text
              - name: formula
                label: Enkel formel
                type: string
              - name: labels
                label: Etiketter
                type: object
                fields:
                  - name: visits
                    label: Relevante besøk per måned
                    type: string
                  - name: conversion
                    label: Konverteringsrate i dag
                    type: string
                  - name: trafficIncrease
                    label: Mer relevant trafikk
                    type: string
                  - name: newConversion
                    label: Ny konverteringsrate
                    type: string
                  - name: current
                    label: I dag
                    type: string
                  - name: scenario
                    label: Scenario
                    type: string
                  - name: difference
                    label: Forskjell
                    type: string
                  - name: outcome
                    label: Resultatenhet
                    type: string
                  - name: increase
                    label: Prosentvis endring
                    type: string
                  - name: undefinedIncrease
                    label: Merknad ved null utgangspunkt
                    type: string
                  - name: invalid
                    label: Veiledning ved ugyldige verdier
                    type: string
              - name: defaults
                label: Startverdier
                type: object
                fields:
                  - name: visits
                    label: Relevante besøk per måned
                    type: number
                  - name: conversion
                    label: Konverteringsrate i dag
                    type: number
                  - name: trafficIncrease
                    label: Mer relevant trafikk
                    type: number
                  - name: newConversion
                    label: Ny konverteringsrate
                    type: number
              - name: caveat
                label: Forbehold
                type: text
          - name: packages
            label: Felles pakker for forsiden, /priser/, /synlighet/ og /konvertering/
            description: Eneste kommersielle pakkekilde. Forsiden og /priser/ bruker hele pakkene; Synlighet og Konvertering bruker navn, priser, mva. og merking i prisbroene. Gjentatte prisfakta i FAQ følger samme kilde. D-024-verdiene endres bare etter et nytt uttrykkelig kommersielt/content-handoff.
            type: object
            fields:
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: intro
                label: Innledning
                type: text
              - name: fitLabel
                label: Etikett for hvem tjenesten passer
                type: string
              - name: scopeLabel
                label: Etikett for arbeidsidé
                type: string
              - name: areasLabel
                label: Etikett for arbeidsområder
                type: string
              - name: areas
                label: Fire arbeidsområder
                type: string
                list: true
              - name: foundationNote
                label: Måling og sporing – felles grunnlag
                type: text
              - name: adBudgetNote
                label: Annonsebudsjett kommer i tillegg
                type: string
              - name: externalCostsNote
                label: Eksterne plattformkostnader
                type: text
              - name: separateWorkNote
                label: Arbeid som prises separat
                type: text
              - name: capacityNote
                label: Ubrukt kapasitet
                type: text
              - name: items
                label: Alternativer
                type: object
                list: true
                fields:
                  - name: title
                    label: Tittel
                    type: string
                  - name: descriptor
                    label: Pakkeoppsummering
                    type: string
                  - name: fit
                    label: Passer for
                    type: text
                  - name: scope
                    label: Arbeidsidé
                    type: text
                  - name: price
                    label: Månedspris i kroner
                    type: number
                  - name: priceSuffix
                    label: Prisenhet
                    type: string
                  - name: vatSuffix
                    label: MVA-tekst
                    type: string
                  - name: recommended
                    label: Anbefalt pakke
                    type: boolean
                    default: false
                  - name: badge
                    label: Anbefalt-merke
                    type: string
                  - name: cta
                    label: Primær handling
                    type: object
                    fields:
                      - name: label
                        label: Tekst
                        type: string
                      - name: href
                        label: Intern lenke
                        type: string
                        pattern: ^/
          - name: proof
            label: Dokumenterte resultater – separat publiseringsvern
            type: object
            fields:
              - name: publicationApproved
                label: Godkjenn visning av allerede publiserbare case
                description: Slå bare på etter dokumentert godkjenning. Dette overstyrer aldri case-status, tillatelse eller manglende evidens.
                type: boolean
                default: false
              - name: caseIds
                label: Velg case fra evidensregisteret
                type: reference
                options:
                  collection: proofCases
                  multiple: true
                  value: "{fields.id}"
                  label: "{fields.clientName} ({fields.publicationStatus})"
                  search: "id,clientName,anonymizedLabel"
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: beforeLabel
                label: Før-etikett
                type: string
              - name: afterLabel
                label: Etter-etikett
                type: string
              - name: changeLabel
                label: Endring-etikett
                type: string
          - name: form
            label: Skjema
            type: object
            fields:
              - name: promise
                label: Gratis sjekk – leveranseløfte
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: websiteLabel
                label: Etikett for nettside
                type: string
              - name: websitePlaceholder
                label: Eksempel på nettside
                type: string
              - name: emailLabel
                label: Etikett for e-post
                type: string
              - name: emailPlaceholder
                label: Eksempel på e-post
                type: string
              - name: messageLabel
                label: Etikett for kommentar
                type: string
              - name: optional
                label: Valgfritt-merknad
                type: string
              - name: messagePlaceholder
                label: Eksempel på kommentar
                type: string
              - name: sensitiveNotice
                label: Merknad om sensitive opplysninger
                type: string
              - name: previewNotice
                label: Forhåndsvisningsmerknad
                type: string
              - name: submitLabel
                label: Knappetekst
                type: string
              - name: privacyText
                label: Personvernmerknad
                type: string
              - name: privacyLink
                label: Personvernlenke
                type: object
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: disabledStatus
                label: Status ved stengt innsending
                type: string
          - name: faqHeading
            label: FAQ-overskrift
            type: string
          - name: faqEyebrow
            label: FAQ-overtekst
            type: string
          - name: chrome
            label: Toppmeny og bunntekst
            type: object
            fields:
              - name: brand
                label: Merkenavn
                type: string
              - name: brandLocation
                label: Stedsnavn i ordmerket
                type: string
              - name: homeLabel
                label: Tilgjengelig forsidenavn
                type: string
              - name: skipLabel
                label: Hopp til innhold
                type: string
              - name: navigationLabel
                label: Hovedmenynavn
                type: string
              - name: mobileNavigationLabel
                label: Mobilmenynavn
                type: string
              - name: openMenu
                label: Åpne meny
                type: string
              - name: closeMenu
                label: Lukk meny
                type: string
              - name: assessmentLink
                label: Lenke til gratis sjekk
                type: object
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: navigation
                label: Navigasjon
                type: object
                list: true
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: providerText
                label: Leverandørtekst
                type: string
              - name: previewLabel
                label: Forhåndsvisningsetikett
                type: string
              - name: serviceNavigationLabel
                label: Tjenestemenynavn
                type: string
              - name: informationNavigationLabel
                label: Informasjonsmenynavn
                type: string
              - name: storeLink
                label: Nettbutikklenke
                type: object
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: informationLinks
                label: Informasjonslenker
                type: object
                list: true
                fields:
                  - name: label
                    label: Tekst
                    type: string
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^/
              - name: copyrightProvider
                label: Leverandør i opphavsrett
                type: string
              - name: footerNote
                label: Bunntekstmerknad
                type: string
      - name: sections
        label: Mekanisme, kvalifisering, sjekk og leverandør
        type: object
        list: true
        fields:
          - name: id
            label: Seksjonens lenkeanker
            type: string
            readonly: true
          - name: eyebrow
            label: Overtekst
            type: string
          - name: heading
            label: Overskrift
            type: string
          - name: body
            label: Avsnitt
            type: text
            list: true
          - name: items
            label: Alternativer
            type: object
            list: true
            fields:
              - name: title
                label: Tittel
                type: string
              - name: text
                label: Beskrivelse
                type: string
          - name: links
            label: Relaterte lenker
            component: link
            list: true
      - name: faq
        label: Spørsmål og svar
        type: object
        list: true
        fields:
          - name: question
            label: Spørsmål
            type: string
          - name: answer
            label: Svar
            type: text
