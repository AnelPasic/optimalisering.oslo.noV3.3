# Pages CMS: one shared package source in home.json; review/launch gates remain in coordination.
media:
  - name: assets
    label: Eksisterende media
    input: app/src/assets
    output: /assets
  - name: heroImages
    label: Forsidefoto – valgte bilde og alternativer
    input: app/public/images/home
    output: /images/home
    extensions:
      - webp
    rename: safe
  - name: serviceHeroImages
    label: Tjenestenes drømmeutfall – leverte bilder og illustrasjoner
    input: app/public/images/services
    output: /images/services
    extensions:
      - webp
      - png
      - jpg
      - jpeg
      - avif
      - svg
    rename: safe
  - name: packageVisuals
    label: Pakkeillustrasjoner – SVG, WebP og PNG
    input: app/public/images/pricing
    output: /images/pricing
    extensions:
      - svg
      - webp
      - png
    rename: safe
  - name: listingImages
    label: Bilder til innholdslister
    input: app/public/images/listing
    output: /images/listing
    extensions: [webp, png, jpg, jpeg, avif]
    rename: safe
settings:
  content:
    merge: true
  commit:
    templates:
      update: "Innholdsoppdatering: {path} (via Pages CMS)"
      create: "Nytt innhold: {path} (via Pages CMS)"
      delete: "Slettet innhold: {path} (via Pages CMS)"
components:
  link:
    type: object
    fields:
      - name: label
        label: Lenketekst
        type: string
        required: true
      - name: href
        label: Intern lenke
        type: string
        pattern: ^/
        required: false
  surfaceChoice:
    type: select
    options:
      placeholder: Standard
      values:
        - name: default
          label: Standard
        - name: base
          label: Hvit
        - name: soft
          label: Lys
        - name: mint
          label: Mint
        - name: lavender
          label: Lavendel
        - name: dark
          label: Plomme
  sectionContent:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - name: surface
        label: Seksjonsfarge
        component: surfaceChoice
        description: Bakgrunn for hele seksjonen. Standard beholder designets opprinnelige farge.
      - name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Forsidens innhold → Felles pakker.
      - name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^(/.*)?$
          - name: label
            label: Lenketekst
            type: string
          - name: surface
            label: Boksfarge
            component: surfaceChoice
            description: Bakgrunn for denne boksen. Standard beholder designets opprinnelige farge.
      - name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  listingVisual:
    type: block
    blockKey: kind
    list:
      min: 0
      max: 1
    description: Velg én listevisual med Ingen, Bilde eller Ikon. Bytt type på samme rad. Bildet eller ikonet eies av artikkelen og brukes i Bildekort og Bilde og tekst annenhver side.
    blocks:
      - name: none
        label: Ingen
        fields: []
      - name: image
        label: Bilde
        fields:
          - name: src
            label: Bilde
            type: image
            required: true
            options:
              media: listingImages
          - name: alt
            label: Alternativ tekst
            type: string
            required: true
            description: Beskriv det faktiske bildet kort og konkret.
          - name: positionX
            label: Horisontalt utsnitt
            type: number
            default: 50
            options:
              min: 0
              max: 100
          - name: positionY
            label: Vertikalt utsnitt
            type: number
            default: 50
            options:
              min: 0
              max: 100
      - name: icon
        label: Ikon
        fields:
          - name: icon
            label: Ikon
            type: select
            required: true
            options:
              values:
                - name: search
                  label: Søk
                - name: conversion
                  label: Konvertering
                - name: analytics
                  label: Måling
                - name: trend
                  label: Utvikling
                - name: page
                  label: Side
                - name: route
                  label: Veivalg
  insightArticleReference:
    type: reference
    options:
      collection: insightArticles
      value: "{fields.slug}"
      label: "{primary} ({fields.slug})"
      search: listing.title,title,slug
  sectionPageList:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - name: surface
        label: Seksjonsfarge
        component: surfaceChoice
      - name: body
        label: Avsnitt
        type: text
        list: {}
      - name: pageList
        label: Innholdsliste
        type: object
        required: true
        fields:
          - name: mode
            label: Utvalg
            type: select
            default: automatic
            required: true
            options:
              values:
                - name: automatic
                  label: Automatisk
                - name: manual
                  label: Manuelt valgt
          - name: sort
            label: Sortering
            type: select
            default: editorial
            description: Gjelder automatisk utvalg. Manuelt utvalg følger rekkefølgen under Velg artikler.
            options:
              values:
                - name: editorial
                  label: Redaksjonell
                - name: title
                  label: Tittel
          - name: limit
            label: Maks antall
            type: number
            default: 6
            description: Bare automatisk utvalg, 1–12. Manuelt utvalg viser alle valgte, synlige artikler.
            options:
              min: 1
              max: 12
              step: 1
          - name: layout
            label: Visning
            type: select
            default: cards
            options:
              values:
                - name: cards
                  label: Kort
                - name: mediaCards
                  label: Bildekort
                - name: alternating
                  label: Bilde og tekst annenhver side
                - name: compact
                  label: Kompakt
                - name: links
                  label: Lenker
          - name: selected
            label: Velg artikler
            description: Bare manuelt utvalg. Flytt radene for å endre rekkefølgen. Velg hver artikkel én gang.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{slug}"
            fields:
              - name: slug
                label: Artikkel
                component: insightArticleReference
                required: true
          - name: excluded
            label: Ekskluder artikler
            description: Bare automatisk utvalg. Disse artiklene tas ut før Maks antall brukes.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{slug}"
            fields:
              - name: slug
                label: Artikkel
                component: insightArticleReference
                required: true
  sectionProtected:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Forsidens innhold → Felles pakker.
      - name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^(/.*)?$
          - name: label
            label: Lenketekst
            type: string
      - name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  sectionForm:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Forsidens innhold → Felles pakker.
      - name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^(/.*)?$
          - name: label
            label: Lenketekst
            type: string
      - name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  headingAlignment:
    type: select
    options:
      placeholder: Sentrert (standard)
      values:
        - name: center
          label: Sentrert (standard)
        - name: left
          label: Venstrejustert
content:
  - name: terminology
    label: Begreper og forklaringer
    type: file
    path: app/src/content/terminology/glossary.json
    format: json
    fields:
      - name: authority
        label: Innholdsautoritet
        type: string
        required: true
        readonly: true
      - name: title
        label: Overskrift
        type: string
        required: true
      - name: intro
        label: Ingress
        type: text
        required: true
      - name: description
        label: Metabeskrivelse
        type: text
        required: true
      - name: linkLabel
        label: Lenketekst til begrepssiden
        type: string
        required: true
      - name: moreLabel
        label: Lenketekst i forklaringen
        type: string
        required: true
      - name: exampleLabel
        label: Eksempeletikett
        type: string
        required: true
      - name: panelLabel
        label: Tilgjengelig navn på forklaring
        type: string
        required: true
      - name: terms
        label: Begreper
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.term}"
        required: true
        fields:
          - name: id
            label: Stabilt anker (beskyttet)
            type: string
            required: true
            readonly: true
            pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          - name: term
            label: Begrep
            type: string
            required: true
          - name: fullName
            label: Fullt navn
            type: string
            required: false
          - name: aliases
            label: Alternative navn
            type: string
            required: false
            list: true
          - name: category
            label: Kategori
            type: select
            required: true
            options:
              values:
                - Synlighet og søk
                - Annonsering
                - Konvertering
                - Måling og økonomi
          - name: shortDefinition
            label: Kort forklaring (én setning, maks. 180 tegn)
            type: text
            required: true
          - name: fullDefinition
            label: Full forklaring
            type: text
            required: true
          - name: simpleExample
            label: Enkelt eksempel
            type: text
            required: false

