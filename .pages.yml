            blockKey: kind
            required: true
            blocks:
              - name: none
                label: Ingen – bare tekst (velg Bilde for bildevalg)
                type: object
                fields: []
              - name: image
                label: Bilde – velg eller endre bilde
                type: object
                fields:
                  - name: image
                    label: Valgt bilde og utsnitt
                    type: object
                    required: true
                    fields:
                      - name: kind
                        label: Bildetype
