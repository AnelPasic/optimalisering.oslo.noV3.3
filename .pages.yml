    type: object
    fields:
      - name: visibility
        label: Synlighet
        component: sectionVisibility
        description: Skjul beholder tekst og anker uten å vise seksjonen. Én sjekk-seksjon må være synlig (lokal eller global). Lenker til skjulte eller fjernede ankere stoppes av bygget.
