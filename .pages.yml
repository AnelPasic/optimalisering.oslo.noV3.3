  - name: proofCases
    label: Case/evidens (intern)
    type: collection
    path: app/src/content/proof
    format: json
    filename: "{fields.id}.json"
    view:
      primary: clientName
      fields:
        - clientName
        - publicationStatus
        - namingPermission
        - artifactStatus
    fields:
      - name: id
        label: Stabil case-ID
        description: Referanser fra forsiden bruker denne ID-en. Endring krever at referansene oppdateres.
        type: string
        pattern: ^[a-z0-9][a-z0-9-]*$
        required: true
        readonly: true
      - name: clientName
        label: Kunde- eller visningsnavn
        type: string
        required: true
        readonly: true
      - name: anonymizedLabel
        label: Godkjent anonymisert navn
        type: string
        readonly: true
      - name: relationship
        label: Relasjon og bakgrunn – intern evidens
        type: text
        readonly: true
      - name: dominantMetric
        label: Hovedresultat og måledefinisjon
        type: text
        required: true
        readonly: true
      - name: before
        label: Før-verdi
        type: string
        readonly: true
      - name: after
        label: Etter-verdi
        type: string
        readonly: true
      - name: delta
        label: Dokumentert endring
        type: string
        readonly: true
      - name: period
        label: Sammenligningsperioder
        type: object
        fields:
          - name: before
            label: Før-periode
            type: string
            readonly: true
          - name: after
            label: Etter-periode
            type: string
            readonly: true
          - name: comparable
            label: Sammenlignbarhet dokumentert
            type: boolean
            default: false
            required: true
            readonly: true
        required: true
        readonly: true
      - name: intervention
        label: Dokumentert tiltak eller endring
        type: text
        readonly: true
      - name: source
        label: Kilde og proveniens – intern evidens
        type: text
        required: true
        readonly: true
      - name: limitations
        label: Begrensninger og attribusjonsforbehold
        type: text
        readonly: true
      - name: namingPermission
        label: Navne- eller anonymiseringstillatelse
        type: select
        default: NEEDS_PERMISSION
        options:
          values:
            - NEEDS_PERMISSION
            - GRANTED
            - NAME_APPROVED
            - ANONYMIZED_APPROVED
        required: true
        readonly: true
      - name: permissionEvidence
        label: Dokumentasjon på faktisk publiseringstillatelse
        type: text
        readonly: true
      - name: strategyReviewStatus
        label: STRATEGY_CONTENT-review
        description: GRANTED tillatelse erstatter ikke review av den konkrete offentlige presentasjonen.
        type: select
        default: READY_FOR_STRATEGY_REVIEW
        options:
          values:
            - READY_FOR_STRATEGY_REVIEW
            - CONTENT_LOCKED
        required: true
        readonly: true
      - name: strategyReviewEvidence
        label: Kilde/revisjon for konkret STRATEGY_CONTENT-lock
        type: text
        readonly: true
      - name: artifactStatus
        label: Skjermbilde- og kildeartefaktstatus
        type: select
        default: NOT_IMPORTED
        options:
          values:
            - NOT_IMPORTED
            - IMPORTED
            - VERIFIED
        required: true
        readonly: true
      - name: artifactReferences
        label: Kildeartefaktreferanser – ikke legg persondata i Git
        type: string
        list: {}
        required: false
        readonly: true
      - name: evidenceMetrics
        label: Supplerte målinger – intern evidens, ikke offentlig renderer
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{metric}"
        fields:
          - name: metric
            label: Måling og definisjon
            type: text
            required: true
            readonly: true
          - name: before
            label: Før-verdi
            type: string
            readonly: true
          - name: after
            label: Etter-verdi
            type: string
            readonly: true
          - name: delta
            label: Dokumentert endring
            type: string
            readonly: true
          - name: nextPeriod
            label: Neste periodes verdi
            type: string
            readonly: true
          - name: timeframe
            label: Periode
            type: string
            readonly: true
        required: false
        readonly: true
      - name: publicationStatus
        label: Publiseringsstatus
        description: EVIDENCE_ONLY er intern forberedelse. PUBLISHABLE krever dokumenterte målinger, sammenlignbare perioder, tiltak, kilde, forbehold og tillatelse.
        type: select
        default: EVIDENCE_ONLY
        options:
          values:
            - EVIDENCE_ONLY
            - REVIEW_REQUIRED
            - PUBLISHABLE
            - WITHDRAWN
        required: true
        readonly: true
      - name: publicationApproved
        label: Publisering uttrykkelig godkjent
        type: boolean
        default: false
        required: true
        readonly: true
    operations:
      create: false
      delete: false
      rename: false
