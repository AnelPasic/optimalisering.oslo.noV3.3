      - *serviceHeading
      - *serviceHeadingAlign
      - *serviceLayout
      - *serviceSurface
      - *serviceBody
      - *serviceItems
      - *serviceLinks
  seoGlobalPlacement:
    type: object
    fields:
      - name: element
        label: Globalt element
        type: select
        required: true
        options:
          values:
            - name: priser
              label: Pakker og priser (inkludert bestillingspaneler)
            - name: sjekk
              label: Gratis sjekk / kontaktskjema
        description: Felles elementer fra Globale elementer. Endrer ikke pris, pakke eller skjemafelt. Bestilling og innsending forblir deaktivert i noindex-preview.
      - name: visibility
        label: Visning på denne siden
        component: sectionVisibility
        description: Flytt, skjul eller fjern bare plasseringen. Originalinnholdet lagres ett sted.
