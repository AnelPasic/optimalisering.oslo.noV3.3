              label: Medon - klarhet, kommersiell logikk og tørr humor
            - name: spiss
              label: Spiss - mer observasjonshumor og litt frekkhet
            - name: spissplus
              label: Spiss+ (nivå 4) - skarpere observasjoner og kommersiell brodd
