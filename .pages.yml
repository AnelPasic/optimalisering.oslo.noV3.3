                    label: Overskrift
                    type: string
                    readonly: true
                  - name: before
                    label: before
                    type: string
                    readonly: true
                  - name: change
                    label: change
                    type: string
                    readonly: true
                  - name: after
                    label: after
                    type: string
                    readonly: true
                  - name: evidence
                    label: evidence
                    type: string
                    readonly: true
          - name: form
            label: Skjema
            type: object
            fields:
              - name: heading
                label: Overskrift
                type: string
              - name: websiteLabel
                label: Etikett for nettside
                type: string
              - name: websitePlaceholder
                label: Eksempel på nettside
                type: string
              - name: emailLabel
