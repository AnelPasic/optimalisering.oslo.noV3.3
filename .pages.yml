            label: Før-verdi
            type: string
            readonly: true
          - name: after
            label: Etter-verdi
            type: string
            readonly: true
          - name: delta
            label: Dokumentert endring
            type: string
            readonly: true
          - name: nextPeriod
            label: Neste periodes verdi
            type: string
            readonly: true
          - name: timeframe
            label: Periode
            type: string
            readonly: true
        required: false
        readonly: true
      - name: publicationStatus
