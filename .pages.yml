content:
  - name: contentTone
    label: Språk og tone
    type: file
    path: coordination/CONTENT-TONE.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: defaultPreset
        label: Normal tone på nettsiden
        type: select
        required: true
        description: Brukes neste gang ChatGPT skriver eller justerer tekst. Endrer ikke eksisterende nettsidetekst automatisk.
        options:
          values:
            - name: noktern
              label: Nøktern - presis og rett på sak
            - name: medon
              label: Medon - klarhet, kommersiell logikk og tørr humor
            - name: spiss
              label: Spiss - mer observasjonshumor og litt frekkhet
            - name: spissplus
              label: Spiss+ (nivå 4) - skarpere observasjoner og kommersiell brodd
      - name: heroPreset
        label: Hero og hovedoverskrifter
        type: select
        required: true
        description: Velg Følg normal tone med mindre du vil styre denne teksttypen særskilt.
        options: &voicePresetOverrides
          values:
            - name: inherit
              label: Følg normal tone
            - name: noktern
              label: Nøktern
            - name: medon
              label: Medon
            - name: spiss
              label: Spiss
            - name: spissplus
              label: Spiss+ (nivå 4)
      - name: servicePreset
        label: Tjenestekort og salgstekster
        type: select
        required: true
        options: *voicePresetOverrides
      - name: explanationPreset
        label: Begrepsforklaringer og innsikt
        type: select
        required: true
        description: Her tåler språket ofte mer konkretisering og tørr humor. Faglig presisjon er alltid påkrevd.
        options: *voicePresetOverrides
      - name: faqPreset
        label: Spørsmål og svar
        type: select
        required: true
        options: *voicePresetOverrides
      - name: editorNotes
        label: Særlige ønsker for tonen
        type: text
        required: false
        description: Gjelder fremtidige omskrivinger, ikke automatisk omformulering av eksisterende innhold. Priser, bestillingsfelt, resultater og juridisk innhold skal fortsatt være nøkterne.
  - name: homepage
    label: Forside
    type: file
    path: app/src/content/pages/home.json
    format: json
    fields:
      - &serviceslug
        name: slug
        label: URL-slug
        type: string
        readonly: true
        required: true
        description: "Skrivebeskyttet URL-del. Forsidens interne slug home vises som /. Andre sider vises som /slug/."
      - name: seo
        label: SEO
        type: object
        fields:
          - name: title
            label: Sidetittel
            type: string
            required: true
          - name: description
            label: Metabeskrivelse
            type: text
            required: true
        required: true
      - name: hero
        label: Hero
        type: object
        required: true
        fields:
          - &hubHerolayout
            name: layout
            label: Oppsett
            component: heroLayoutChoice
          - &hubHeroeyebrow
            name: eyebrow
            label: Overtekst
            type: string
            required: true
          - &hubHerotitle
            name: title
            label: Hovedoverskrift
            type: string
            required: true
          - &hubHerosupport
            name: support
            label: Ingress
            type: text
            required: true
          - &hubHeroprimaryCta
            name: primaryCta
            label: Primær handling
            component: link
            required: true
          - &hubHerosecondaryCta
            name: secondaryCta
            label: Sekundær handling
            component: link
          - &heroProofCase
            name: featuredProofCaseId
            label: Utvalgt Proof i Hero
            description: Valgfritt. Vis et dokumentert resultat som et lite kort over Hero-bildet. Bare kundecaser som oppfyller alle publiserings- og evidenskrav vises. Ingen overstyring av Case/evidens (intern).
            type: reference
            options:
              collection: proofCases
