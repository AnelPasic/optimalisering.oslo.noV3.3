                    label: Relevante besøk per måned
                    type: number
                  - name: conversion
                    label: Konverteringsrate i dag
                    type: number
                  - name: trafficIncrease
                    label: Mer relevant trafikk
                    type: number
                  - name: newConversion
                    label: Ny konverteringsrate
                    type: number
              - name: caveat
                label: Forbehold
                type: text
          - name: packages
            label: Tjenestekort og prisstatus
            type: object
            fields:
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
              - name: intro
                label: Innledning
                type: text
              - name: fitLabel
                label: Etikett for hvem tjenesten passer
                type: string
              - name: scopeLabel
                label: Etikett for arbeidsidé
                type: string
              - name: items
                label: Alternativer
                type: object
                list: true
                fields:
                  - name: title
                    label: Tittel
                    type: string
                  - name: fit
                    label: Passer for
                    type: text
                  - name: scope
                    label: Arbeidsidé
                    type: text
                  - name: priceState
                    label: Prisstatus
                    type: string
                  - name: externalCosts
                    label: Eksterne kostnader
                    type: string
                  - name: cta
                    label: Primær handling
                    type: object
                    fields:
                      - name: label
                        label: Tekst
                        type: string
                      - name: href
                        label: Intern lenke
                        type: string
                        pattern: ^/
          - name: proof
            label: Bevis – venter på publiseringstillatelse
            type: object
            readonly: true
            fields:
              - name: publicationApproved
                label: Publisering godkjent
                type: boolean
                readonly: true
              - name: case
                label: Før → endring → etter (reservert)
                type: object
                readonly: true
                fields:
