media:
  - name: assets
    label: Eksisterende media
    input: app/src/assets
    output: /assets
  - name: heroImages
    label: Forsidefoto – valgte bilde og alternativer
    input: app/public/images/home
    output: /images/home
    extensions:
      - webp
    rename: safe
  - name: serviceHeroImages
    label: Tjenestenes drømmeutfall – leverte bilder og illustrasjoner
    input: app/public/images/services
    output: /images/services
    extensions:
      - webp
      - png
      - jpg
      - jpeg
      - avif
      - svg
    rename: safe
  - name: packageVisuals
    label: Pakkeillustrasjoner – SVG, WebP og PNG
    input: app/public/images/pricing
    output: /images/pricing
    extensions:
      - svg
      - webp
      - png
    rename: safe
  - name: listingImages
    label: Bilder til innholdslister
    input: app/public/images/listing
    output: /images/listing
    extensions:
      - webp
      - png
      - jpg
      - jpeg
      - avif
    rename: safe
  - name: proofImages
    label: Casebilder til forhåndsvisning
    input: app/public/images/proof
    output: /images/proof
    extensions:
      - webp
      - png
      - jpg
      - jpeg
      - avif
    rename: safe
settings:
  content:
    merge: true
  commit:
    templates:
      update: "Innholdsoppdatering: {path} (via Pages CMS)"
      create: "Nytt innhold: {path} (via Pages CMS)"
      delete: "Slettet innhold: {path} (via Pages CMS)"
components:
  sectionVisibility:
    type: select
    options:
      placeholder: Publisert
      values:
        - name: ""
          label: Publisert
        - name: hidden
          label: Skjult – behold i CMS
  link:
    type: object
    fields:
      - name: label
        label: Lenketekst
        type: string
        required: true
      - name: href
        label: Intern lenke
        type: string
        pattern: ^/
        required: false
  heroLayoutChoice:
    type: select
    description: Bildet, bildetype, beskrivelse og utsnitt bevares når du velger Sentrert uten bilde. Velg et annet oppsett for å vise det igjen. Sentrert med bilde viser tekst uten bilde hvis siden ikke har et lagret bilde. Teksten kommer først på mobil.
    options:
      placeholder: Tekst venstre / bilde høyre
      values:
        - name: split-right
          label: Tekst venstre / bilde høyre
        - name: split-left
          label: Bilde venstre / tekst høyre
        - name: centered
          label: Sentrert med bilde
        - name: centered-none
          label: Sentrert uten bilde
  pageHero:
    type: object
    label: Hero
    fields:
      - name: layout
        label: Oppsett
        component: heroLayoutChoice
  surfaceChoice:
    type: select
    options:
      placeholder: Standard
      values:
        - name: default
          label: Standard
        - name: base
          label: Hvit
        - name: soft
          label: Lys
        - name: mint
          label: Mint
        - name: lavender
          label: Lavendel
        - name: dark
          label: Plomme
  contentLayoutChoice:
    type: select
    options:
      placeholder: Standard (automatisk)
      values:
        - name: default
          label: Standard (automatisk)
        - name: two-columns
          label: To kolonner
        - name: three-columns
          label: Tre kolonner
        - name: stacked
          label: Liste (én kolonne)
  boxVariantChoice:
    type: select
    options:
      placeholder: Standard (automatisk)
      values:
        - name: default
          label: Standard (automatisk)
        - name: plain
          label: Åpen boks
        - name: card
          label: Kort
  sectionContent:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - &serviceEyebrow
        name: eyebrow
        label: Overtekst
        type: string
      - &serviceHeading
        name: heading
        label: Overskrift
        type: string
        required: true
      - &serviceHeadingAlign
        name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - &serviceLayout
        name: layout
        label: Seksjonsoppsett
        component: contentLayoutChoice
        description: Fordeling av vanlige bokser. Standard beholder dagens oppsett. Flere kolonner blir én på mobil. Seksjonstype og farger endres ikke.
      - &serviceSurface
        name: surface
        label: Seksjonsfarge
        component: surfaceChoice
        description: Bakgrunn for hele seksjonen. Standard beholder designets opprinnelige farge.
      - &serviceBody
        name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Globale elementer → Pakker og priser.
      - &serviceItems
        name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^(/.*)?$
          - name: label
            label: Lenketekst
            type: string
          - name: boxVariant
            label: Boksvariant
            component: boxVariantChoice
            description: Standard beholder dagens boks. Åpen boks og Kort bruker felles designprimitiver; Boksfarge velges separat.
          - name: surface
            label: Boksfarge
            component: surfaceChoice
            description: Bakgrunn for denne boksen. Standard beholder designets opprinnelige farge.
      - &serviceLinks
        name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  listingVisual:
    type: block
    blockKey: kind
    list:
      min: 0
      max: 1
    description: Velg én listevisual med Ingen, Bilde eller Ikon. Bytt type på samme rad. Bildet eller ikonet eies av artikkelen og brukes i Bildekort og Bilde og tekst annenhver side.
    blocks:
      - name: none
        label: Ingen
        fields: []
      - name: image
        label: Bilde
        fields:
          - name: src
            label: Bilde
            type: image
            required: true
            options:
              media: listingImages
          - name: alt
            label: Alternativ tekst
            type: string
            required: true
            description: Beskriv det faktiske bildet kort og konkret.
          - name: positionX
            label: Horisontalt utsnitt
            type: number
            default: 50
            options:
              min: 0
              max: 100
          - name: positionY
            label: Vertikalt utsnitt
            type: number
            default: 50
            options:
              min: 0
              max: 100
      - name: icon
        label: Ikon
        fields:
          - name: icon
            label: Ikon
            type: select
            required: true
            options:
              values:
                - name: search
                  label: Søk
                - name: conversion
                  label: Konvertering
                - name: analytics
                  label: Måling
                - name: trend
                  label: Utvikling
                - name: page
                  label: Side
                - name: route
                  label: Veivalg
  insightArticleReference:
    type: reference
    options:
      collection: insightArticles
      value: "{fields.slug}"
      label: "{primary} ({fields.slug})"
      search: listing.title,title,slug
  sectionPageList:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - name: surface
        label: Seksjonsfarge
        component: surfaceChoice
      - name: body
        label: Avsnitt
        type: text
        list: {}
      - name: pageList
        label: Innholdsliste
        type: object
        required: true
        fields:
          - name: mode
            label: Utvalg
            type: select
            default: automatic
            required: true
            options:
              values:
                - name: automatic
                  label: Automatisk
                - name: manual
                  label: Manuelt valgt
          - name: sort
            label: Sortering
            type: select
            default: editorial
            description: Gjelder automatisk utvalg. Manuelt utvalg følger rekkefølgen under Velg artikler.
            options:
              values:
                - name: editorial
                  label: Redaksjonell
                - name: title
                  label: Tittel
          - name: limit
            label: Maks antall
            type: number
            default: 6
            description: Bare automatisk utvalg, 1–12. Manuelt utvalg viser alle valgte, synlige artikler.
            options:
              min: 1
              max: 12
              step: 1
          - name: layout
            label: Visning
            type: select
            default: cards
            options:
              values:
                - name: cards
                  label: Kort
                - name: mediaCards
                  label: Bildekort
                - name: alternating
                  label: Bilde og tekst annenhver side
                - name: compact
                  label: Kompakt
                - name: links
                  label: Lenker
          - name: selected
            label: Velg artikler
            description: Bare manuelt utvalg. Flytt radene for å endre rekkefølgen. Velg hver artikkel én gang.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{slug}"
            fields:
              - name: slug
                label: Artikkel
                component: insightArticleReference
                required: true
          - name: excluded
            label: Ekskluder artikler
            description: Bare automatisk utvalg. Disse artiklene tas ut før Maks antall brukes.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{slug}"
            fields:
              - name: slug
                label: Artikkel
                component: insightArticleReference
                required: true
  sectionProtected:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Seksjoner → Pakker og priser.
      - name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^(/.*)?$
          - name: label
            label: Lenketekst
            type: string
      - name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  sectionForm:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Seksjoner → Pakker og priser.
      - name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^(/.*)?$
          - name: label
            label: Lenketekst
            type: string
      - name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  headingAlignment:
    type: select
    options:
      placeholder: Sentrert (standard)
      values:
        - name: center
          label: Sentrert (standard)
        - name: left
          label: Venstrejustert
  synlighetSectionContent:
    type: object
    fields:
      - name: visibility
        label: Synlighet
        component: sectionVisibility
        description: Skjul beholder tekst og anker. Sjekk-, kundebevis- og prisbroseksjoner må være synlige; ugyldige endringer stoppes av bygget.
      - name: id
        label: Seksjonens lenkeanker
        type: string
        required: true
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: Unik, stabil ID, for eksempel faglig-informasjon. Behold eksisterende ankere når du redigerer eller flytter.
      - *serviceEyebrow
      - *serviceHeading
      - *serviceHeadingAlign
      - *serviceLayout
      - *serviceSurface
      - *serviceBody
      - *serviceItems
      - *serviceLinks
  serviceGlobalPlacement:
    type: object
    fields:
      - name: element
        label: Globalt element
        type: select
        required: true
        options:
          values:
            - name: behov
              label: Behovsvelger
            - name: regneeksempel
              label: Konverteringskalkulator
            - name: resultater
              label: Kunderesultater
            - name: mekanisme
              label: Slik jobber vi
            - name: passer
              label: Hvem det passer for
        description: Innhold redigeres én gang under Globale elementer. Kunderesultater erstatter lokalt kundebevis når plasseringen er publisert. Behovsvelger erstatter lokal behovseksjon. Skjul/fjern plasseringen for å vise lokalt innhold igjen. Priser, skjema og FAQ bruker fortsatt sidens eksisterende beskyttede oppsett.
      - name: visibility
        label: Visning på denne siden
        component: sectionVisibility
        description: Flytt, skjul eller fjern bare plasseringen på denne siden. Masterens tekst, bilder og UUID beholdes i Globale elementer.
content:
  - name: terminology
    label: Begreper og forklaringer
    type: file
    path: app/src/content/terminology/glossary.json
    format: json
    fields:
      - name: authority
        label: Innholdsautoritet
        type: string
        required: true
        readonly: true
      - name: hero
        component: pageHero
      - name: title
        label: Overskrift
        type: string
        required: true
      - name: intro
        label: Ingress
        type: text
        required: true
      - name: description
        label: Metabeskrivelse
        type: text
        required: true
      - name: linkLabel
        label: Lenketekst til begrepssiden
        type: string
        required: true
      - name: moreLabel
        label: Lenketekst i forklaringen
        type: string
        required: true
      - name: exampleLabel
        label: Eksempeletikett
        type: string
        required: true
      - name: panelLabel
        label: Tilgjengelig navn på forklaring
        type: string
        required: true
      - name: terms
        label: Begreper
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.term}"
        required: true
        fields:
          - name: id
            label: Stabilt anker (beskyttet)
            type: string
            required: true
            readonly: true
            pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          - name: term
            label: Begrep
            type: string
            required: true
          - name: fullName
            label: Fullt navn
            type: string
            required: false
          - name: aliases
            label: Alternative navn
            type: string
            required: false
            list: true
          - name: category
            label: Kategori
            type: select
            required: true
            options:
              values:
                - Synlighet og søk
                - Annonsering
                - Konvertering
                - Måling og økonomi
          - name: shortDefinition
            label: Kort forklaring (én setning, maks. 180 tegn)
            type: text
            required: true
          - name: fullDefinition
            label: Full forklaring
            type: text
            required: true
          - name: simpleExample
            label: Enkelt eksempel
            type: text
            required: false
  - name: homepage
    label: Forside
    type: file
    path: app/src/content/pages/home.json
    format: json
    fields:
      - name: seo
        label: SEO
        type: object
        fields:
          - name: title
            label: Sidetittel
            type: string
            required: true
          - name: description
            label: Metabeskrivelse
            type: text
            required: true
        required: true
      - name: hero
        label: Hero
        type: object
        required: true
        fields:
          - name: layout
            label: Oppsett
            component: heroLayoutChoice
          - name: eyebrow
            label: Overtekst
            type: string
            required: true
          - name: title
            label: Hovedoverskrift
            type: string
            required: true
          - name: support
            label: Ingress
            type: text
            required: true
          - name: primaryCta
            label: Primær handling
            component: link
            required: true
          - name: secondaryCta
            label: Sekundær handling
            component: link
          - name: visual
            label: Bilde
            type: object
            fields:
              - name: kind
                label: Visuelt innhold
                type: select
                options:
                  values:
                    - name: image
                      label: Bilde
                    - name: none
                      label: Ingen
              - name: image
                label: Valgt bilde og utsnitt
                type: object
                fields:
                  - name: src
                    label: Valgt bilde
                    type: image
                    options:
                      media: heroImages
                    required: true
                  - name: positionX
                    label: Horisontalt utsnitt (%)
                    type: number
                    default: 50
                    options:
                      min: 0
                      max: 100
                    required: true
                  - name: positionY
                    label: Vertikalt utsnitt (%)
                    type: number
                    default: 50
                    options:
                      min: 0
                      max: 100
                    required: true
      - name: topSections
        label: Valgfrie seksjoner Topp
        type: block
        blockKey: _block
        list:
          max: 16
          collapsible:
            collapsed: true
            summary: "{element}{name}"
        blocks:
          - name: global
            label: Globalt element
            fields: &a1
              - name: element
                label: Globalt element
                type: select
                required: true
                options:
                  values:
                    - name: behov
                      label: Behovsvelger
                    - name: regneeksempel
                      label: Konverteringskalkulator
                    - name: sjekk
                      label: Gratis sjekk / kontaktskjema
                    - name: priser
                      label: Pakker og priser
                    - name: resultater
                      label: Kunderesultater
                    - name: mekanisme
                      label: Slik jobber vi
                    - name: passer
                      label: Hvem det passer for
                    - name: sporsmal
                      label: Ofte stilte spørsmål
              - name: visibility
                label: Visning på denne siden
                component: sectionVisibility
                description: "Fjerning sletter bare plasseringen. Eksisterende lenker til #sjekk og #priser må få et gyldig mål før disse skjules eller fjernes."
          - name: content
            label: Innholdsseksjon
            fields: &a2
              - name: visibility
                label: Visning på nettsiden
                component: sectionVisibility
                description: Publisert er standard. Skjult beholder hele seksjonen i CMS, men fjerner den fra alle offentlige seksjonseksempler og forsiden.
              - name: uid
                type: uuid
                hidden: true
                options:
                  editable: false
                  generate: true
                required: true
                readonly: true
              - name: name
                label: Navn i seksjonslisten
                type: string
                required: true
              - name: id
                label: Seksjonens lenkeanker
                type: string
                required: true
                pattern: ^(?!(?:behov|regneeksempel|sjekk|priser|resultater|mekanisme|passer|sporsmal|skjema|main|mobile-menu|site-menu|order-package|website|email|message)$)(?!(?:calc-|scenario-|package-home-|term-))[a-z0-9]+(?:-[a-z0-9]+)*$
                description: Unikt lenkeanker med små bokstaver og bindestrek, for eksempel nyttig-informasjon. Behold ankeret ved flytting.
              - name: eyebrow
                label: Overtekst
                type: string
              - name: heading
                label: Overskrift
                type: string
                required: true
              - name: headingAlign
                label: Overskriftsjustering
                component: headingAlignment
                description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
              - name: layout
                label: Seksjonsoppsett
                component: contentLayoutChoice
                description: Fordeling av vanlige bokser. Standard beholder dagens oppsett. Flere kolonner blir én på mobil. Seksjonstype og farger endres ikke.
              - name: surface
                label: Seksjonsfarge
                component: surfaceChoice
                description: Bakgrunn for hele seksjonen. Standard beholder designets opprinnelige farge.
              - name: body
                label: Avsnitt
                type: text
                list: {}
                description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Seksjoner → Pakker og priser.
              - name: items
                label: Alternativer eller steg
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: Tittel
                    type: string
                    required: true
                  - name: text
                    label: Beskrivelse
                    type: text
                    required: true
                  - name: href
                    label: Intern lenke
                    type: string
                    pattern: ^(/.*)?$
                  - name: label
                    label: Lenketekst
                    type: string
                  - name: boxVariant
                    label: Boksvariant
                    component: boxVariantChoice
                    description: Standard beholder dagens boks. Åpen boks og Kort bruker felles designprimitiver; Boksfarge velges separat.
                  - name: surface
                    label: Boksfarge
                    component: surfaceChoice
                    description: Bakgrunn for denne boksen. Standard beholder designets opprinnelige farge.
              - name: links
                label: Relaterte lenker
                component: link
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
      - name: sections
        label: Hovedseksjoner
        type: block
        blockKey: _block
        list:
          max: 24
          collapsible:
            collapsed: true
            summary: "{element}{name}"
        blocks:
          - name: global
            label: Globalt element
            fields: *a1
          - name: content
            label: Innholdsseksjon
            fields: *a2
      - name: bottomSections
        label: Valgfrie seksjoner Bunn
        type: block
        blockKey: _block
        list:
          max: 16
          collapsible:
            collapsed: true
            summary: "{element}{name}"
        blocks:
          - name: global
            label: Globalt element
            fields: *a1
          - name: content
            label: Innholdsseksjon
            fields: *a2
      - name: homepage
        label: Felles toppmeny og bunntekst
        type: object
        fields:
          - name: chrome
            label: Toppmeny og bunntekst
            type: object
            fields:
              - name: brand
                label: Merkenavn
                type: string
                required: true
              - name: brandLocation
                label: Stedsnavn i ordmerket
                type: string
                required: true
              - name: homeLabel
                label: Tilgjengelig forsidenavn
                type: string
                required: true
              - name: skipLabel
                label: Hopp til innhold
                type: string
                required: true
              - name: navigationLabel
                label: Hovedmenynavn
                type: string
                required: true
              - name: mobileNavigationLabel
                label: Mobilmenynavn
                type: string
                required: true
              - name: openMenu
                label: Åpne meny
                type: string
                required: true
