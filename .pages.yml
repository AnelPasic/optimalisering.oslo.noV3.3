# Pages CMS schema refresh 2026-10-26: Toppmeny mobileLogoLight / mobileLogoDark.
# This comment-only GitHub push refreshes the per-branch config cache via CMS webhook when installed.
media:
  - name: assets
    label: Eksisterende media
    input: app/src/assets
    output: /assets
  - name: heroImages
    label: Forsidefoto – valgte bilde og alternativer
    input: app/public/images/home
    output: /images/home
    extensions:
      - webp
    rename: safe
  - name: serviceHeroImages
    label: Tjenestenes drømmeutfall – leverte bilder og illustrasjoner
    input: app/public/images/services
    output: /images/services
    extensions:
      - webp
      - png
      - jpg
      - jpeg
      - avif
      - svg
    rename: safe
  - name: packageVisuals
    label: Pakkeillustrasjoner – SVG, WebP og PNG
    input: app/public/images/pricing
    output: /images/pricing
    extensions:
      - svg
      - webp
      - png
    rename: safe
  - name: listingImages
    label: Bilder til innholdslister
    input: app/public/images/listing
    output: /images/listing
    extensions:
      - webp
      - png
      - jpg
      - jpeg
      - avif
    rename: safe
  - name: proofImages
    label: Casebilder til forhåndsvisning
    input: app/public/images/proof
    output: /images/proof
    extensions:
      - webp
      - png
      - jpg
      - jpeg
      - avif
    rename: safe
  - name: brandLogos
    label: Logoer til toppmeny og footer
    input: app/public/images/branding
    output: /images/branding
    extensions:
      - svg
      - png
      - webp
      - jpg
      - jpeg
      - avif
    rename: safe
settings:
  content:
    merge: true
  commit:
    templates:
      update: "Innholdsoppdatering: {path} (via Pages CMS)"
      create: "Nytt innhold: {path} (via Pages CMS)"
      delete: "Slettet innhold: {path} (via Pages CMS)"
components:
  sectionVisibility:
    type: select
    options:
      placeholder: Publisert
      values:
        - name: ""
          label: Publisert
        - name: hidden
          label: Skjult – behold i CMS
  link:
    type: object
    fields:
      - name: label
        label: Lenketekst
        type: string
        required: true
      - name: href
        label: Intern lenke
        type: string
        pattern: ^/
        required: false
  heroLayoutChoice:
    type: select
    description: Bildet, bildetype, beskrivelse og utsnitt bevares når du velger Sentrert uten bilde. Velg et annet oppsett for å vise det igjen. Sentrert med bilde viser tekst uten bilde hvis siden ikke har et lagret bilde. Teksten kommer først på mobil.
    options:
      placeholder: Tekst venstre / bilde høyre
      values:
        - name: split-right
          label: Tekst venstre / bilde høyre
        - name: split-left
          label: Bilde venstre / tekst høyre
        - name: centered
          label: Sentrert med bilde
        - name: centered-none
          label: Sentrert uten bilde
  surfaceChoice:
    type: select
    options:
      placeholder: Standard
      values:
        - name: default
          label: Standard
        - name: base
          label: Hvit
        - name: soft
          label: Lys
        - name: mint
          label: Mint
        - name: lavender
          label: Lavendel
        - name: dark
          label: Plomme
  contentLayoutChoice:
    type: select
    options:
      placeholder: Standard (automatisk)
      values:
        - name: default
          label: Standard (automatisk)
        - name: two-columns
          label: To kolonner
        - name: three-columns
          label: Tre kolonner
        - name: stacked
          label: Liste (én kolonne)
  boxVariantChoice:
    type: select
    options:
      placeholder: Standard (automatisk)
      values:
        - name: default
          label: Standard (automatisk)
        - name: plain
          label: Åpen boks
        - name: card
          label: Kort
  sectionContent:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - &serviceEyebrow
        name: eyebrow
        label: Overtekst
        type: string
      - &serviceHeading
        name: heading
        label: Overskrift
        type: string
        required: true
      - &serviceHeadingAlign
        name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - &serviceLayout
        name: layout
        label: Seksjonsoppsett
        component: contentLayoutChoice
        description: Samme kolonnevalg brukes uavhengig for avsnitt og bokser. Tre avsnitt og tre bokser blir to separate rader med kolonner. På mobil vises én kolonne. Standard beholder opprinnelig oppsett.
      - &serviceSurface
        name: surface
        label: Seksjonsfarge
        component: surfaceChoice
        description: Bakgrunn for hele seksjonen. Standard beholder designets opprinnelige farge.
      - &serviceBody
        name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Globale elementer → Pakker og priser.
      - &serviceItems
        name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: '^(\s*|/.*)
          - name: label
            label: Lenketekst
            type: string
          - name: boxVariant
            label: Boksvariant
            component: boxVariantChoice
            description: Standard beholder dagens boks. Åpen boks og Kort bruker felles designprimitiver; Boksfarge velges separat.
          - name: surface
            label: Boksfarge
            component: surfaceChoice
            description: Bakgrunn for denne boksen. Standard beholder designets opprinnelige farge.
      - &serviceLinks
        name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  listingVisual:
    type: block
    blockKey: kind
    list:
      min: 0
      max: 1
    description: Velg én listevisual med Ingen, Bilde eller Ikon. Bytt type på samme rad. Bildet eller ikonet eies av artikkelen og brukes i Bildekort og Bilde og tekst annenhver side.
    blocks:
      - name: none
        label: Ingen
        fields: []
      - name: image
        label: Bilde
        fields:
          - name: src
            label: Bilde
            type: image
            required: true
            options:
              media: listingImages
          - name: alt
            label: Alternativ tekst
            type: string
            required: true
            description: Beskriv det faktiske bildet kort og konkret.
          - name: positionX
            label: Horisontalt utsnitt
            type: number
            default: 50
            options:
              min: 0
              max: 100
          - name: positionY
            label: Vertikalt utsnitt
            type: number
            default: 50
            options:
              min: 0
              max: 100
      - name: icon
        label: Ikon
        fields:
          - name: icon
            label: Ikon
            type: select
            required: true
            options:
              values:
                - name: search
                  label: Søk
                - name: conversion
                  label: Konvertering
                - name: analytics
                  label: Måling
                - name: trend
                  label: Utvikling
                - name: page
                  label: Side
                - name: route
                  label: Veivalg
  insightArticleReference:
    type: reference
    options:
      collection: insightArticles
      value: "{fields.slug}"
      label: "{primary} ({fields.slug})"
      search: listing.title,title,slug
  pageListPageReference:
    type: select
    options:
      placeholder: Søk etter side eller URL
      values:
# PAGE_LIST_PAGE_OPTIONS_START
        - name: "ai-synlighet"
          label: "AI-synlighet - bli forstått med riktig informasjon | Medon"
        - name: "home"
          label: "SEO, AI-synlighet og konverteringsoptimalisering | Optimalisering Oslo"
        - name: "innsikt"
          label: "Innsikt - velg startpunkt og vurder effekten | Medon"
        - name: "innsikt/google-bedriftsprofil"
          label: "Google bedriftsprofil - praktisk guide"
        - name: "innsikt/hva-bor-optimaliseres-forst"
          label: "Hva bør optimaliseres først?"
        - name: "innsikt/male-effekt-av-optimalisering"
          label: "Hvordan måle effekten?"
        - name: "kontakt"
          label: "Kontakt om Optimalisering Oslo | Medon AS"
        - name: "konvertering"
          label: "Konverteringsoptimalisering (CRO) | Optimalisering Oslo"
        - name: "lokal-seo"
          label: "Lokal SEO for Google Maps og lokale søk | Medon"
        - name: "nettbutikkoptimalisering"
          label: "Nettbutikkoptimalisering - fra oppdagelse til kjøp | Medon"
        - name: "om"
          label: "Om Optimalisering Oslo og Medon AS"
        - name: "personvern"
          label: "Personvern - Optimalisering Oslo"
        - name: "priser"
          label: "Priser på SEO, CRO og digital optimalisering | Optimalisering Oslo"
        - name: "seo"
          label: "SEO-byrå for bedrifter i Oslo | Optimalisering Oslo"
        - name: "synlighet"
          label: "SEO, lokal SEO og AI-synlighet | Optimalisering Oslo"
        - name: "vilkar"
          label: "Vilkår - hva må avtales før videre arbeid? | Medon"
        - name: "vurdering"
          label: "Gratis manuell sjekk av nettsiden | Medon"
# PAGE_LIST_PAGE_OPTIONS_END
  sectionPageList:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        required: true
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - name: surface
        label: Seksjonsfarge
        component: surfaceChoice
      - name: body
        label: Avsnitt
        type: text
        list: {}
      - name: pageList
        label: Innholdsliste
        type: object
        required: true
        fields:
          - name: source
            label: Automatisk kilde
            type: select
            default: articles
            options:
              values:
                - name: articles
                  label: Innsiktartikler
                - name: pages
                  label: Nettsider og tjenester
                - name: cases
                  label: Godkjente kundecaser
          - name: mode
            label: Utvalg
            type: select
            default: automatic
            required: true
            options:
              values:
                - name: automatic
                  label: Automatisk
                - name: manual
                  label: Manuelt valgt
          - name: sort
            label: Sortering
            type: select
            default: editorial
            description: Gjelder automatisk utvalg. Manuelt utvalg følger rekkefølgen under Velg innhold.
            options:
              values:
                - name: editorial
                  label: Redaksjonell
                - name: title
                  label: Tittel
          - name: limit
            label: Maks antall
            type: number
            default: 6
            description: Automatisk 1–12 (anbefalt 2–9). Manuelt maksimalt 9.
            options:
              min: 1
              max: 12
              step: 1
          - name: layout
            label: Visning
            type: select
            default: cards
            options:
              values:
                - name: cards
                  label: Kort
                - name: mediaCards
                  label: Bildekort
                - name: alternating
                  label: Bilde og tekst annenhver side
                - name: compact
                  label: Kompakt
                - name: links
                  label: Lenker
          - name: entries
            label: Velg innhold manuelt (2–9)
            description: Bland valgte sider, godkjente kundecaser og egne URL-er i ønsket rekkefølge.
            type: block
            blockKey: _block
            list:
              max: 9
              collapsible:
                collapsed: true
                summary: "{index}. {title}{slug}{caseId}{href}"
            blocks:
              - name: page
                label: Eksisterende side
                type: object
                fields:
                  - name: slug
                    label: Velg side
                    component: pageListPageReference
                    required: true
              - name: case
                label: Kundecase
                type: object
                fields:
                  - name: caseId
                    label: Velg kundecase
                    type: reference
                    required: true
                    options:
                      collection: proofCases
                      value: "{fields.id}"
                      label: "{fields.clientName} ({fields.publicationStatus})"
                      search: id,clientName
              - name: url
                label: Egen intern/ekstern URL
                type: object
                fields:
                  - name: href
                    label: URL
                    type: string
                    required: true
                  - name: title
                    label: Overskrift
                    type: string
                    required: true
                  - name: summary
                    label: Kort beskrivelse
                    type: text
                  - name: label
                    label: Lenketekst
                    type: string
                    default: Les mer
          - name: selected
            label: Tidligere artikkelutvalg
            description: For gamle H-021-lister; v2 bruker Velg innhold.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{slug}"
            fields:
              - name: slug
                label: Artikkel
                component: insightArticleReference
                required: true
          - name: excluded
            label: Ekskluder artikler
            description: Bare automatisk utvalg. Disse artiklene tas ut før Maks antall brukes.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{slug}"
            fields:
              - name: slug
                label: Artikkel
                component: insightArticleReference
                required: true
  sectionProtected:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: headingAlign
        label: Overskriftsjustering
        component: headingAlignment
        description: Sentrert er standard. Velg Venstrejustert når seksjonen leses bedre som en vanlig tekstseksjon.
      - name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Seksjoner → Pakker og priser.
      - name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^(/.*)?$
          - name: label
            label: Lenketekst
            type: string
      - name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  sectionForm:
    type: object
    fields:
      - name: id
        label: Seksjonens lenkeanker
        type: string
        readonly: true
        required: true
      - name: eyebrow
        label: Overtekst
        type: string
      - name: heading
        label: Overskrift
        type: string
        required: true
      - name: body
        label: Avsnitt
        type: text
        list: {}
        description: Avsnitt i denne seksjonen. Felles pakketekster og priser redigeres under Forside → Seksjoner → Pakker og priser.
      - name: items
        label: Alternativer eller steg
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tittel
            type: string
            required: true
          - name: text
            label: Beskrivelse
            type: text
            required: true
          - name: href
            label: Intern lenke
            type: string
            pattern: ^(/.*)?$
          - name: label
            label: Lenketekst
            type: string
      - name: links
        label: Relaterte lenker
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
  headingAlignment:
    type: select
    options:
      placeholder: Sentrert (standard)
      values:
        - name: center
          label: Sentrert (standard)
        - name: left
          label: Venstrejustert
  synlighetSectionContent:
    type: object
    fields:
      - name: visibility
        label: Synlighet
        component: sectionVisibility
        description: Skjul beholder tekst og anker uten å vise seksjonen. Én sjekk-seksjon må være synlig (lokal eller global). Lenker til skjulte eller fjernede ankere stoppes av bygget.
      - name: id
        label: Seksjonens lenkeanker
        type: string
        required: true
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: Unik, stabil ID, for eksempel faglig-informasjon. Behold eksisterende ankere når du redigerer eller flytter.
      - *serviceEyebrow
      - *serviceHeading
      - *serviceHeadingAlign
      - *serviceLayout
      - *serviceSurface
      - *serviceBody
      - *serviceItems
      - *serviceLinks
  seoGlobalPlacement:
    type: object
    fields:
      - name: element
        label: Globalt element
        type: select
        required: true
        options:
          values:
            - name: priser
              label: Pakker og priser (inkludert bestillingspaneler)
            - name: sjekk
              label: Gratis sjekk / kontaktskjema
        description: Felles elementer fra Globale elementer. Endrer ikke pris, pakke eller skjemafelt. Bestilling og innsending forblir deaktivert i noindex-preview.
      - name: visibility
        label: Visning på denne siden
        component: sectionVisibility
        description: Flytt, skjul eller fjern bare plasseringen. Originalinnholdet lagres ett sted.
  sharedContentPlacement:
    type: object
    fields:
      - name: entry
        label: Velg global innholdsseksjon
        type: reference
        required: true
        options:
          collection: sharedContent
          search: "name,heading,id"
          value: "{fields.id}"
          label: "{fields.name}"
        description: Innholdet redigeres under Global Innhold → Egendefinerte seksjoner. Her velger du bare plassering.
      - name: visibility
        label: Visning på denne siden
        component: sectionVisibility
        description: Skjul eller fjern kun plasseringen; originalinnholdet beholdes.
  serviceGlobalPlacement:
    type: object
    fields:
      - name: element
        label: Globalt element
        type: select
        required: true
        options:
          values:
            - name: behov
              label: Behovsvelger
            - name: regneeksempel
              label: Konverteringskalkulator
            - name: sjekk
              label: Gratis sjekk / kontaktskjema
            - name: resultater
              label: Kunderesultater
            - name: mekanisme
              label: Slik jobber vi
            - name: passer
              label: Hvem det passer for
            - name: priser
              label: Pakker og priser
            - name: sporsmal
              label: Ofte stilte spørsmål
        description: Én synlig rad gir én seksjon på samme sted. Innhold redigeres én gang under Globale elementer. Skjul eller fjern bare plasseringen; ingen lokal erstatning settes inn. Skjul eller fjern en lokal rad med samme lenkeanker før du velger det globale elementet. Gratis sjekk kan velges når den lokale sjekk-raden er fjernet; aldri begge samtidig.
      - name: visibility
        label: Visning på denne siden
        component: sectionVisibility
        description: Flytt, skjul eller fjern bare plasseringen på denne siden. Masterens tekst, bilder og UUID beholdes i Globale elementer.
content:
  - name: contentTone
    label: Språk og tone
    type: file
    path: coordination/CONTENT-TONE.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: defaultPreset
        label: Normal tone på nettsiden
        type: select
        required: true
        description: Brukes neste gang ChatGPT skriver eller justerer tekst. Endrer ikke eksisterende nettsidetekst automatisk.
        options:
          values:
            - name: noktern
              label: Nøktern - presis og rett på sak
            - name: medon
              label: Medon - klarhet, kommersiell logikk og tørr humor
            - name: spiss
              label: Spiss - mer observasjonshumor og litt frekkhet
            - name: spissplus
              label: Spiss+ (nivå 4) - skarpere observasjoner og kommersiell brodd
      - name: heroPreset
        label: Hero og hovedoverskrifter
        type: select
        required: true
        description: Velg Følg normal tone med mindre du vil styre denne teksttypen særskilt.
        options: &voicePresetOverrides
          values:
            - name: inherit
              label: Følg normal tone
            - name: noktern
              label: Nøktern
            - name: medon
              label: Medon
            - name: spiss
              label: Spiss
            - name: spissplus
              label: Spiss+ (nivå 4)
      - name: servicePreset
        label: Tjenestekort og salgstekster
        type: select
        required: true
        options: *voicePresetOverrides
      - name: explanationPreset
        label: Begrepsforklaringer og innsikt
        type: select
        required: true
        description: Her tåler språket ofte mer konkretisering og tørr humor. Faglig presisjon er alltid påkrevd.
        options: *voicePresetOverrides
      - name: faqPreset
        label: Spørsmål og svar
        type: select
        required: true
        options: *voicePresetOverrides
      - name: editorNotes
        label: Særlige ønsker for tonen
        type: text
        required: false
        description: Gjelder fremtidige omskrivinger, ikke automatisk omformulering av eksisterende innhold. Priser, bestillingsfelt, resultater og juridisk innhold skal fortsatt være nøkterne.
  - name: homepage
    label: Forside
    type: file
    path: app/src/content/pages/home.json
    format: json
    fields:
      - &serviceslug
        name: slug
        label: URL-slug
        type: string
        readonly: true
        required: true
        description: "Skrivebeskyttet URL-del. Forsidens interne slug home vises som /. Andre sider vises som /slug/."
      - name: seo
        label: SEO
        type: object
        fields:
          - name: title
            label: Sidetittel
            type: string
            required: true
          - name: description
            label: Metabeskrivelse
            type: text
            required: true
        required: true
      - name: hero
        label: Hero
        type: object
        required: true
        fields:
          - &hubHerolayout
            name: layout
            label: Oppsett
            component: heroLayoutChoice
          - &hubHeroeyebrow
            name: eyebrow
            label: Overtekst
            type: string
            required: true
          - &hubHerotitle
            name: title
            label: Hovedoverskrift
            type: string
            required: true
          - &hubHerosupport
            name: support
            label: Ingress
            type: text
            required: true
          - &hubHeroprimaryCta
            name: primaryCta
            label: Primær handling
            component: link
            required: true
          - &hubHerosecondaryCta
            name: secondaryCta
            label: Sekundær handling
            component: link
          - &heroProofCase
            name: featuredProofCaseId
            label: Utvalgt Proof i Hero
            description: Valgfritt. Vis et dokumentert resultat som et lite kort over Hero-bildet. Bare kundecaser som oppfyller alle publiserings- og evidenskrav vises. Ingen overstyring av Case/evidens (intern).
            type: reference
            options:
              collection: proofCases
              value: "{fields.id}"
              label: "{fields.clientName} ({fields.publicationStatus})"
              search: id,clientName
          - name: visual
            label: Visuelt innhold
            description: Velg Bilde under Visuelt innhold for å åpne bildevelger, bildetype og utsnitt. Ingen viser bare tekst. Lagret bilde bevares hvis du senere velger Ingen.
            type: block
            blockKey: kind
            required: true
